<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>T恤接力大作战</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;user-select:none;font-family:"Microsoft YaHei",Arial,sans-serif}
body{background:radial-gradient(ellipse at center,#3a1a5c 0%,#1a0a2e 60%,#05010f 100%);display:flex;justify-content:center;align-items:center;color:#fff}

/* 星空 */
#starCanvas{position:fixed;inset:0;pointer-events:none;z-index:0}

/* ─── 右上角 Logo 占位 ─── */
#logoArea{position:fixed;top:18px;right:24px;z-index:200;width:200px;height:90px;
  display:flex;align-items:center;justify-content:center;
}
#logoArea img{max-width:100%;max-height:100%;object-fit:contain}

/* ─── 整体布局 ─── */
#tvWrap{position:relative;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100vw;height:100vh;gap:6px}
#antenna{position:relative;width:280px;height:96px;margin-bottom:-8px;z-index:6}
#antenna svg{width:100%;height:100%;overflow:visible}
.antBlink{animation:antBlink 1.2s ease-in-out infinite}
@keyframes antBlink{50%{filter:drop-shadow(0 0 14px #ffd166)}}

#mainRow{display:flex;align-items:stretch;gap:18px;width:min(98vw,1700px);height:min(82vh,860px)}

/* ─── 左侧 IP 图片占位 ─── */
#leftPanel{width:240px;flex-shrink:0;display:flex;flex-direction:column;justify-content:space-between;gap:12px;padding:4px 0}
.statCard{border-radius:20px;padding:14px;text-align:center;color:#fff;
  background:linear-gradient(180deg,#ffb347 0%,#ff7e5f 60%,#cc5836 100%);
  box-shadow:
    inset 0 6px 0 rgba(255,255,255,.3),inset 0 -6px 0 rgba(0,0,0,.22),
    0 14px 30px rgba(0,0,0,.55),
    0 0 0 4px #5a2010,0 0 0 7px #2a0d05;
}
.ipBoxLeft{border-radius:18px;padding:10px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.18);
  box-shadow:0 10px 24px rgba(0,0,0,.45);
  min-height:150px;overflow:hidden;
}
.ipBoxLeft img{max-width:100%;max-height:200px;object-fit:contain;border-radius:12px}
.statCard .lbl{font-size:1.1rem;color:#3a0d00;font-weight:bold;letter-spacing:4px;margin-bottom:6px}
.statCard .val{font-size:4.6rem;font-weight:900;line-height:1;display:block;font-family:"Microsoft YaHei",Arial,sans-serif}
.statCard .val.name{font-size:1.7rem;line-height:1.2;word-break:break-all;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.statCard .val.mode{font-size:1rem;letter-spacing:3px;margin-top:6px;color:#3a0d00;font-weight:bold;opacity:.9}
#cardPlayer{padding:14px}
#cardScore .val{color:#fff;text-shadow:0 0 14px #fff,0 0 30px #ff6ec7,0 4px 0 #b91d73}
#cardTime  .val{color:#fff;text-shadow:0 0 14px #fff,0 0 30px #ffd700,0 4px 0 #aa7700}
#cardTime.warn .val{color:#fff;text-shadow:0 0 14px #fff,0 0 30px #ff4444,0 4px 0 #770000;animation:warnPulse .6s ease-in-out infinite}
@keyframes warnPulse{50%{transform:scale(1.08)}}

/* ─── 电视机 ─── */
#tvBody{
  flex:1;position:relative;
  background:linear-gradient(180deg,#ffb347 0%,#ff7e5f 60%,#cc5836 100%);
  border-radius:42px;
  padding:32px 40px 80px 40px;
  box-shadow:
    inset 0 8px 0 rgba(255,255,255,.35),
    inset 0 -10px 0 rgba(0,0,0,.25),
    0 22px 60px rgba(0,0,0,.7),
    0 0 0 6px #5a2010,
    0 0 0 10px #2a0d05;
  display:flex;
}
#tvBody::before{
  content:"";position:absolute;top:18px;left:60px;width:140px;height:14px;border-radius:10px;
  background:linear-gradient(90deg,rgba(255,255,255,.7),rgba(255,255,255,0));
  filter:blur(2px);pointer-events:none;
}
#tvBody::after{
  content:"SOCI-TV";position:absolute;bottom:30px;left:50%;transform:translateX(-50%);
  color:#3a0d00;font-size:.78rem;letter-spacing:4px;font-weight:bold;
}

/* 屏幕 */
#screen{
  flex:1;position:relative;border-radius:32px;overflow:hidden;
  background:#0a0a18;
  box-shadow:inset 0 0 40px rgba(0,0,0,.9),inset 0 0 0 8px #1a1a2e,inset 0 0 0 14px #444;
}
#screen::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:80;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%);
  border-radius:32px;
}
#scanlines{position:absolute;inset:0;z-index:79;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.12) 2px,rgba(0,0,0,.12) 4px);
}

/* ─── 右侧排行榜（替代旋钮区） ─── */
#rightBoard{
  width:280px;flex-shrink:0;
  background:linear-gradient(180deg,#ffb347 0%,#ff7e5f 60%,#cc5836 100%);
  border-radius:28px;padding:16px 14px;
  box-shadow:
    inset 0 6px 0 rgba(255,255,255,.3),inset 0 -8px 0 rgba(0,0,0,.22),
    0 18px 40px rgba(0,0,0,.6),
    0 0 0 5px #5a2010,0 0 0 9px #2a0d05;
  display:flex;flex-direction:column;
}
#boardHeader{text-align:center;color:#3a0d00;font-weight:900;font-size:1.1rem;letter-spacing:3px;
  padding:8px 0;margin-bottom:8px;border-bottom:3px solid #3a0d0033}
#boardBody{flex:1;overflow-y:auto;background:rgba(0,0,0,.45);border-radius:14px;padding:8px 6px;
  border:2px solid #3a0d0044}
#boardBody::-webkit-scrollbar{width:6px}
#boardBody::-webkit-scrollbar-thumb{background:#ff6ec7aa;border-radius:3px}
.bRow{display:grid;grid-template-columns:36px 1fr 60px;align-items:center;gap:6px;padding:7px 8px;border-radius:8px;font-size:.92rem;color:#fff;margin:2px 0}
.bRow:nth-child(odd){background:rgba(255,255,255,.06)}
.bRow.me{background:linear-gradient(90deg,#ffd70030,#ff6ec730);border:1px solid #ffd700}
.bRow .rk{font-weight:bold;text-align:center}
.bRow .rk.g{color:#ffd700;font-size:1.15rem}
.bRow .rk.s{color:#ccc;font-size:1.05rem}
.bRow .rk.b{color:#cd7f32;font-size:1.05rem}
.bRow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bRow .sv{color:#ffd700;font-weight:bold;text-align:right}
.bEmpty{color:#aaa;text-align:center;padding:30px 10px;font-size:.85rem}

/* 底座 */
#tvFeet{margin-top:-18px;display:flex;justify-content:center;gap:740px;width:min(98vw,1700px);pointer-events:none;z-index:4}
.foot{width:80px;height:38px;background:linear-gradient(180deg,#5a2010,#2a0d05);border-radius:0 0 22px 22px;box-shadow:0 10px 24px rgba(0,0,0,.6)}

/* ─── 屏幕内 HUD（已移至左侧卡片，这里仅保留以便扩展） ─── */
#hud{display:none}

/* 风向 */
#windBar{position:absolute;top:120px;left:50%;transform:translateX(-50%);z-index:60;
  display:flex;align-items:center;gap:14px;background:rgba(0,0,0,.5);border-radius:22px;padding:8px 22px;
  color:#cef;font-size:1.1rem;font-weight:bold;border:2px solid rgba(120,200,255,.4);pointer-events:none;
  transition:opacity .3s;
}
#windArrow{font-size:1.6rem;display:inline-block;transition:transform .3s}

/* Buff */
#buffBar{position:absolute;top:120px;right:20px;z-index:60;display:flex;flex-direction:column;gap:8px;pointer-events:none;align-items:flex-end}
.buff{background:rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.3);border-radius:12px;
  padding:7px 16px;color:#fff;font-size:1rem;font-weight:bold;letter-spacing:.5px}
.buff.double{border-color:#ffd700;color:#ffd700;text-shadow:0 0 10px #ffd700}
.buff.freeze{border-color:#00d2ff;color:#00d2ff;text-shadow:0 0 10px #00d2ff}
.buff.scissor{border-color:#ff7e5f;color:#ff7e5f;text-shadow:0 0 10px #ff7e5f}

/* P2 盖子状态指示（双人模式） */
#lidIndicator{position:absolute;bottom:120px;left:50%;transform:translateX(-50%);z-index:60;
  padding:6px 22px;border-radius:22px;font-size:1.05rem;font-weight:bold;letter-spacing:2px;
  border:2px solid #f9a825;color:#f9a825;background:rgba(0,0,0,.5);transition:all .15s;
  pointer-events:none;
}
#lidIndicator.open{border-color:#00ff88;color:#00ff88;text-shadow:0 0 10px #00ff88}

/* 冲刺 */
#rushOverlay{position:absolute;inset:0;z-index:55;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse at center,rgba(255,40,40,0) 50%,rgba(255,40,40,.45) 100%);
}
#rushOverlay.on{animation:rushPulse .55s ease-in-out infinite}
@keyframes rushPulse{50%{opacity:1}}
#rushText{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:70;
  font-size:6rem;font-weight:900;color:#ff3344;text-shadow:0 0 30px #ff3344,0 0 60px #ff3344;
  letter-spacing:10px;pointer-events:none;opacity:0;
}

/* 连击独立浮空 */
#comboFloat{position:absolute;top:50%;left:30px;transform:translateY(-50%);z-index:62;
  pointer-events:none;text-align:center;opacity:0;transition:opacity .2s;
}
#comboFloat .cLbl{font-size:1rem;color:#cef;letter-spacing:3px;font-weight:bold;text-shadow:0 0 6px #000}
#comboFloat .cNum{font-size:5rem;font-weight:900;color:#00d2ff;text-shadow:0 0 24px #00d2ff,0 0 50px #00d2ff;line-height:1;display:block;margin-top:4px}
#comboFloat .cTag{font-size:1.2rem;color:#ffd700;text-shadow:0 0 10px #ffd700;font-weight:bold;letter-spacing:2px;margin-top:6px;display:block}
#comboFloat.hot .cNum{color:#ff6ec7;text-shadow:0 0 24px #ff6ec7,0 0 50px #ff6ec7}
#comboFloat.fire .cNum{color:#ffd700;text-shadow:0 0 24px #ffd700,0 0 60px #ff6ec7}

#bigCombo{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%) scale(.5);z-index:65;
  font-size:4rem;font-weight:900;color:#ffd700;text-shadow:0 0 28px #ffd700;
  pointer-events:none;opacity:0;letter-spacing:8px;text-align:center;white-space:nowrap;
}

/* 游戏元素 */
.shirt{position:absolute;width:78px;height:78px;filter:drop-shadow(0 0 8px currentColor);z-index:30}
.shirt.gold{filter:drop-shadow(0 0 14px #ffd700) drop-shadow(0 0 28px #ffaa00);animation:goldGlow 1s ease-in-out infinite}
@keyframes goldGlow{50%{filter:drop-shadow(0 0 22px #ffd700) drop-shadow(0 0 44px #ffaa00) brightness(1.3)}}
.item{position:absolute;width:70px;height:70px;z-index:31;display:flex;align-items:center;justify-content:center;font-size:3.4rem;filter:drop-shadow(0 0 14px gold);animation:itemFloat 1.2s ease-in-out infinite}
@keyframes itemFloat{50%{filter:drop-shadow(0 0 22px gold) brightness(1.4)}}

/* 篮子（更大） */
.basket{position:absolute;bottom:18px;width:220px;height:72px;border-radius:0 0 50px 50px;
  background:linear-gradient(180deg,#ff6ec720,#ff6ec760);border:5px solid #ff6ec7;
  box-shadow:0 0 28px #ff6ec7cc,inset 0 -10px 18px rgba(0,0,0,.3);
  display:flex;align-items:center;justify-content:center;font-size:3rem;z-index:40;
}
/* 双人模式 篮子盖子（中间对开） */
#lidWrap{position:absolute;bottom:18px;width:220px;height:22px;z-index:42;display:flex;pointer-events:none}
#lidWrap .lidL,#lidWrap .lidR{
  width:50%;height:100%;
  background:linear-gradient(90deg,#ff6ec7,#f9a825);
  border:2.5px solid #f9a825;
  box-shadow:0 0 14px #f9a825aa;
  transition:transform .18s ease-out,background .18s,box-shadow .18s,border-color .18s;
}
#lidWrap .lidL{border-radius:8px 2px 2px 4px;transform-origin:0% 100%}
#lidWrap .lidR{border-radius:2px 8px 4px 2px;transform-origin:100% 100%}
#lidWrap.open .lidL{transform:rotate(-78deg)}
#lidWrap.open .lidR{transform:rotate(78deg)}
#lidWrap.open .lidL,#lidWrap.open .lidR{
  background:linear-gradient(90deg,#00ff88,#00d2ff);
  border-color:#00ff88;box-shadow:0 0 16px #00ff88;
}
/* 盖子能量条（双人模式） */
#lidEnergy{position:absolute;bottom:6px;width:220px;height:10px;border-radius:6px;
  background:rgba(0,0,0,.55);border:1.5px solid rgba(255,255,255,.35);overflow:hidden;
  z-index:43;box-shadow:0 0 8px rgba(0,0,0,.5);
}
#lidEnergyFill{height:100%;width:100%;border-radius:5px;
  background:linear-gradient(90deg,#00ff88,#00d2ff);
  transition:width .08s linear,background .2s;
  box-shadow:0 0 8px #00d2ff inset;
}
#lidEnergy.low #lidEnergyFill{background:linear-gradient(90deg,#ffd700,#ff8800);box-shadow:0 0 8px #ffaa00 inset}
#lidEnergy.cd  {border-color:#ff4444}
#lidEnergy.cd  #lidEnergyFill{background:linear-gradient(90deg,#ff4444,#ff8800);box-shadow:0 0 8px #ff4444 inset;animation:cdPulse .6s ease-in-out infinite}
@keyframes cdPulse{50%{filter:brightness(1.5)}}
#lidEnergyLabel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:.72rem;font-weight:bold;color:#fff;text-shadow:0 0 4px #000;letter-spacing:1px;pointer-events:none;
}

.spark{position:absolute;border-radius:50%;pointer-events:none;z-index:50}
.floatScore{position:absolute;font-size:1.8rem;font-weight:900;pointer-events:none;z-index:55;white-space:nowrap;text-shadow:0 0 10px currentColor}
.ripple{position:absolute;border-radius:50%;pointer-events:none;z-index:50;border:3px solid currentColor}
#floorGlow{position:absolute;bottom:0;left:0;right:0;height:6px;background:linear-gradient(90deg,transparent,#7f00ff,#00d2ff,#ff6ec7,#7f00ff,transparent);background-size:200% 100%;animation:floorMove 2.4s linear infinite;z-index:32}
@keyframes floorMove{to{background-position:200% 0}}

/* ─── 其他屏内界面 ─── */
.screenPanel{position:absolute;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#1a0a3e 0%,#05010f 100%);padding:30px;text-align:center}
.title{font-size:3.4rem;font-weight:900;letter-spacing:8px;
  background:linear-gradient(90deg,#ff6ec7,#7b5ea7,#00d2ff,#ffd700,#ff6ec7);background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:titleShift 4s linear infinite;margin-bottom:24px;
}
@keyframes titleShift{to{background-position:300% 0}}
.subTitle{color:#cbf;font-size:1.1rem;letter-spacing:2px;margin-bottom:24px;line-height:1.9}
.nameInput{padding:16px 24px;border-radius:14px;border:2px solid #ff6ec7;background:rgba(0,0,0,.4);color:#fff;font-size:1.3rem;width:360px;text-align:center;outline:none;letter-spacing:2px;margin-bottom:18px}
.nameInput:focus{box-shadow:0 0 20px #ff6ec780}
.modeRow{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;align-items:stretch;margin-top:6px;width:100%}
.modeBtn{width:300px;min-height:96px;padding:18px 0;border:none;border-radius:16px;color:#fff;font-size:1.2rem;font-weight:bold;letter-spacing:3px;cursor:pointer;transition:transform .15s;line-height:1.5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.modeBtn:hover{transform:scale(1.06)}
.modeBtn small{display:block;font-weight:normal;font-size:.78rem;opacity:.85;margin-top:6px;letter-spacing:1px}
#btn1P{background:linear-gradient(135deg,#f953c6,#b91d73);box-shadow:0 0 28px #f953c680}
#btn2P{background:linear-gradient(135deg,#f9a825,#e65100);box-shadow:0 0 28px #f9a82580}
.lineBtn{margin-top:14px;background:transparent;border:2px solid #aab;color:#cef;padding:10px 26px;border-radius:12px;cursor:pointer;font-size:1rem;letter-spacing:2px}
.lineBtn:hover{border-color:#fff;color:#fff}
.hint{color:#778;font-size:.9rem;margin-top:12px;letter-spacing:1px}

/* 结束 */
#endTitle{font-size:3rem;font-weight:900;margin-bottom:10px;letter-spacing:6px}
#endDetail{color:#ddd;line-height:2;font-size:1.15rem;margin:10px 0 18px}
#endDetail b{font-size:1.6rem}
.breakRec{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:95;pointer-events:none;background:radial-gradient(circle,rgba(255,215,0,.3),transparent 60%)}
.breakRec span{font-size:6rem;font-weight:900;letter-spacing:14px;color:#ffd700;text-shadow:0 0 30px #ffd700,0 0 60px #ff6ec7;animation:breakPop 1.2s ease-out;white-space:nowrap}
@keyframes breakPop{0%{transform:scale(.3) rotate(-10deg);opacity:0}50%{transform:scale(1.2) rotate(2deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
.firework{position:absolute;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:91}

/* 模式按钮区禁用样式 */
.disabledHint{color:#ff6b6b;font-size:.85rem;margin-top:4px}

/* 隐藏 */
.hide{display:none !important}

/* 小屏自适应 */
@media (max-width:1100px){
  #leftPanel{width:180px;gap:10px}
  .statCard .val{font-size:3.6rem}
  .statCard .val.name{font-size:1.3rem}
  #rightBoard{width:230px}
  #mainRow{gap:12px}
}
@media (max-width:900px){
  #leftPanel{width:150px}
  .statCard{padding:10px 8px}
  .statCard .val{font-size:2.8rem}
  #rightBoard{width:200px}
}
</style>
</head>
<body>

<canvas id="starCanvas"></canvas>

<!-- 右上角 Logo -->
<div id="logoArea">
  <img src="https://libuque.github.io/socixiaocangku/gsoc-logo.png" alt="logo"/>
</div>

<div id="tvWrap">

  <!-- 天线 -->
  <div id="antenna">
    <svg viewBox="0 0 280 96">
      <line x1="140" y1="86" x2="64" y2="10" stroke="#2a0d05" stroke-width="6" stroke-linecap="round"/>
      <line x1="140" y1="86" x2="216" y2="10" stroke="#2a0d05" stroke-width="6" stroke-linecap="round"/>
      <circle cx="64" cy="10" r="9" fill="#ffd166" class="antBlink"/>
      <circle cx="216" cy="10" r="9" fill="#ff6ec7" class="antBlink"/>
      <ellipse cx="140" cy="88" rx="26" ry="7" fill="#2a0d05"/>
    </svg>
  </div>

  <div id="mainRow">

    <!-- 左侧信息面板：玩家 / 得分 / 时间 / IP 图 -->
    <div id="leftPanel">
      <div class="statCard" id="cardPlayer">
        <div class="lbl">玩 家</div>
        <div class="val name" id="elPlayer">--</div>
        <div class="val mode" id="elMode">单人模式</div>
      </div>
      <div class="statCard" id="cardScore">
        <div class="lbl">得 分</div>
        <div class="val" id="elScore">0</div>
      </div>
      <div class="statCard" id="cardTime">
        <div class="lbl">剩余时间</div>
        <div class="val" id="elTime">30</div>
      </div>
      <div class="ipBoxLeft">
        <img src="https://libuque.github.io/socixiaocangku/wenhuashan.png" alt="IP"/>
      </div>
    </div>

    <!-- 电视机 -->
    <div id="tvBody">
      <div id="screen">

        <!-- 启动面板 -->
        <div id="panelStart" class="screenPanel">
          <div class="title">T 恤 接 力 大 作 战</div>
          <div class="subTitle">
            30 秒内得分 <b style="color:#ffd700">≥ 50 分</b> 获 <b style="color:#ffd700">1 次抽奖</b> ｜ 得分 <b style="color:#ffd700">≥ 100 分</b> 获 <b style="color:#ffd700">2 次抽奖</b><br>
            T 恤 +1 分 ｜ <b style="color:#ffd700">金色 T 恤 +2 分</b> ｜ <b style="color:#ff7e5f">剪刀 = 清屏</b> ｜ <b style="color:#ffd700">礼盒 = 随机奖励</b>
          </div>
          <input id="nameInput" class="nameInput" placeholder="请输入玩家名字 (1-12 字)" maxlength="12"/>
          <div class="modeRow">
            <button id="btn1P" class="modeBtn">
              单 人 模 式
              <small>← → 或 A D 移动篮子</small>
            </button>
            <button id="btn2P" class="modeBtn">
              双 人 模 式
              <small>P1 用 A/D 移动 ｜ P2 用空格控盖</small>
            </button>
          </div>
          <button id="btnBoardFromStart" class="lineBtn" style="display:none">查看完整排行榜</button>

        </div>

        <!-- (已移除完整排行榜面板) -->
        <div id="panelBoard" class="screenPanel hide" style="display:none"></div>

        <!-- 游戏运行面板 -->
        <div id="panelGame" class="hide" style="position:absolute;inset:0;z-index:50">
          <div id="gameBg" style="position:absolute;inset:0;background:linear-gradient(180deg,#0d0d2a 0%,#1a1040 60%,#0a1838 100%);z-index:10"></div>
          <div id="cloudWrap" style="position:absolute;inset:0;z-index:12;pointer-events:none"></div>

          <div id="windBar">
            <span>风向</span><span id="windArrow">·</span><span id="windText">无风</span>

<script>
(function(){
'use strict';

/* ───────── 星空 ───────── */
var SC=document.getElementById("starCanvas"),sx=SC.getContext("2d"),stars=[];
function initStars(){SC.width=innerWidth;SC.height=innerHeight;stars=[];for(var i=0;i<140;i++)stars.push({x:Math.random()*SC.width,y:Math.random()*SC.height,r:Math.random()*1.2+.3,a:Math.random(),vy:Math.random()*.4+.1,da:(Math.random()-.5)*.015})}
function drawStars(){sx.clearRect(0,0,SC.width,SC.height);for(var i=0;i<stars.length;i++){var s=stars[i];s.a+=s.da;if(s.a<0){s.a=0;s.da*=-1}if(s.a>1){s.a=1;s.da*=-1}s.y+=s.vy;if(s.y>SC.height)s.y=0;sx.beginPath();sx.arc(s.x,s.y,s.r,0,Math.PI*2);sx.fillStyle="rgba(200,200,255,"+s.a.toFixed(2)+")";sx.fill()}requestAnimationFrame(drawStars)}
initStars();drawStars();addEventListener("resize",initStars);

/* ───────── 音效 ───────── */
var audioCtx=null;
function getAC(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx}
function playTone(freq,type,dur,vol){try{var ac=getAC(),o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type=type||"sine";o.frequency.setValueAtTime(freq,ac.currentTime);o.frequency.exponentialRampToValueAtTime(freq*.5,ac.currentTime+dur);g.gain.setValueAtTime(vol||.18,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);o.start();o.stop(ac.currentTime+dur)}catch(e){}}
function sfxCatch(g){g?playTone(520,"sine",.12,.15):playTone(120,"sawtooth",.2,.2)}
function sfxMiss(){playTone(200,"triangle",.18,.12)}
function sfxCombo(n){playTone(300+n*50,"sine",.1,.18)}
function sfxItem(){playTone(880,"sine",.1,.16);setTimeout(function(){playTone(1320,"sine",.12,.16)},80)}
function sfxScissor(){playTone(700,"square",.08,.14);setTimeout(function(){playTone(900,"square",.08,.14)},70)}
function sfxRush(){playTone(180,"sawtooth",.4,.2);setTimeout(function(){playTone(280,"sawtooth",.3,.16)},150)}
function sfxBreak(){playTone(660,"sine",.2,.2);setTimeout(function(){playTone(880,"sine",.2,.2)},150);setTimeout(function(){playTone(1320,"sine",.4,.22)},300)}
function sfxLid(){playTone(420,"square",.06,.1)}

/* ───────── 存储 ───────── */
var LS_PLAYER="tshirt_lastPlayer",LS_BOARD="tshirt_leaderboard";
function loadBoard(){try{return JSON.parse(localStorage.getItem(LS_BOARD)||"[]")}catch(e){return[]}}
function saveBoard(b){try{localStorage.setItem(LS_BOARD,JSON.stringify(b))}catch(e){}}
function loadPlayer(){try{return localStorage.getItem(LS_PLAYER)||""}catch(e){return""}}
function savePlayer(n){try{localStorage.setItem(LS_PLAYER,n)}catch(e){}}

/* ───────── 常量 ───────── */
var TOTAL_TIME=30,PASS_SCORE=50,COMBO_BONUS_AT=29,COMBO_BONUS_PTS=10,RUSH_TIME=5;
var BSPD=11,BW=220,NORMAL_SPD=4.2;

/* ───────── DOM ───────── */
var panelStart=el("panelStart"),panelBoard=el("panelBoard"),panelGame=el("panelGame"),panelEnd=el("panelEnd");
var nameInput=el("nameInput"),elScore=el("elScore"),elTime=el("elTime"),elPlayer=el("elPlayer"),elMode=el("elMode");
var windArrow=el("windArrow"),windText=el("windText"),windBar=el("windBar"),buffBar=el("buffBar");
var rushOv=el("rushOverlay"),rushText=el("rushText"),bigCombo=el("bigCombo"),comboFloat=el("comboFloat");
var screen=el("screen"),cloudWrap=el("cloudWrap"),lidIndicator=el("lidIndicator");
var boardBody=el("boardBody"); // 电视右侧排行榜
function el(id){return document.getElementById(id)}

/* ───────── 游戏状态 ───────── */
var playerName="",mode=1; // 1=单人,2=双人
var running=false,timeLeft=TOTAL_TIME,score=0,combo=0,maxCombo=0,catches=0,misses=0;
var bx=0,keys={},shirts=[],GW=0,GH=0;
var timerID=0,spawnID=0,rafID=0,phaseID=0,windID=0;
var speedPhase=1.0,wind=0;
var buffs={double:0,freeze:0,scissor:0,clearTill:0};
var rushing=false,lidOpen=false,lidAngle=0;
// 双人模式盖子能量：满 1.0 = 3 秒连续开盖；关上瞬间补满；耗尽后锁定 3 秒
var lidEnergy=1.0,lidLocked=false,lidLockUntil=0,lidLastT=0;
var LID_DRAIN_MS=3000,LID_LOCK_MS=3000;

/* ───────── 衣服 SVG ───────── */
var COLORS=["#ff4d6d","#4895ef","#52b788","#ffd60a","#c77dff","#f77f00","#00f5d4","#ff8fab","#06d6a0","#118ab2"];
function shirtSvg(c,collar,stripe){
  var col=collar==="v"
    ? '<polygon points="35,25 50,45 65,25" fill="rgba(0,0,0,.25)"/>'
    : '<rect x="35" y="25" width="30" height="6" fill="rgba(0,0,0,.25)" rx="2"/>';
  var st=stripe?'<rect x="20" y="55" width="60" height="6" fill="rgba(255,255,255,.35)"/><rect x="20" y="70" width="60" height="6" fill="rgba(255,255,255,.35)"/>':'';
  return '<svg viewBox="0 0 100 100" width="78" height="78">'+
    '<polygon points="0,30 20,10 35,25 65,25 80,10 100,30 80,38 80,95 20,95 20,38" fill="'+c+'" stroke="rgba(255,255,255,.35)" stroke-width="2"/>'+
    '<polygon points="20,10 35,2 65,2 80,10" fill="'+c+'" stroke="rgba(255,255,255,.35)" stroke-width="2"/>'+
    col+st+'</svg>';
}
function goldShirtSvg(){
  var u="g"+Math.floor(Math.random()*999999);
  return '<svg viewBox="0 0 100 100" width="78" height="78">'+
    '<defs><linearGradient id="'+u+'" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0%" stop-color="#fff5b0"/>'+
      '<stop offset="45%" stop-color="#ffd700"/>'+
      '<stop offset="100%" stop-color="#b8860b"/>'+
    '</linearGradient></defs>'+
    '<polygon points="0,30 20,10 35,25 65,25 80,10 100,30 80,38 80,95 20,95 20,38" fill="url(#'+u+')" stroke="rgba(255,255,255,.7)" stroke-width="2.5"/>'+
    '<polygon points="20,10 35,2 65,2 80,10" fill="url(#'+u+')" stroke="rgba(255,255,255,.7)" stroke-width="2.5"/>'+
    '<rect x="35" y="25" width="30" height="6" fill="rgba(0,0,0,.2)" rx="2"/>'+
    '</svg>';
}
var REG_DESIGNS=[
  {base:1.0,fn:function(c){return shirtSvg(c,"crew",false)}},
  {base:1.05,fn:function(c){return shirtSvg(c,"v",false)}},
  {base:.95,fn:function(c){return shirtSvg(c,"crew",true)}},
  {base:1.0,fn:function(c){return shirtSvg(c,"v",true)}}
];

/* ───────── 工具 ───────── */
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v))}
function removeEl(e){if(e&&e.parentNode)e.parentNode.removeChild(e)}
function rand(a,b){return a+Math.random()*(b-a)}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function fmtDate(t){var d=new Date(t),p=function(n){return n<10?"0"+n:n};return (d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes())}
function escapeHtml(s){return(s||"").replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

/* ───────── 面板导航 ───────── */
function showPanel(p){[panelStart,panelBoard,panelGame,panelEnd].forEach(function(x){x.classList.add("hide")});p.classList.remove("hide")}

nameInput.value=loadPlayer();
el("btn1P").onclick=function(){tryStart(1)};
el("btn2P").onclick=function(){tryStart(2)};
function tryStart(m){
  var n=(nameInput.value||"").trim();
  if(!n){alert("请输入玩家名字！");nameInput.focus();return}
  playerName=n;savePlayer(n);mode=m;startGame();
}
el("btnRetry").onclick=function(){startGame()};
el("btnHome").onclick=function(){showPanel(panelStart)};

document.addEventListener("keydown",function(e){
  keys[e.key.toLowerCase()]=true;
  if(e.key===" "||e.key==="ArrowLeft"||e.key==="ArrowRight")e.preventDefault();
  if(e.key==="Enter"&&!panelStart.classList.contains("hide"))el("btn1P").click();
});
document.addEventListener("keyup",function(e){keys[e.key.toLowerCase()]=false});

/* ───────── 排行榜渲染 ───────── */
function renderBoardSide(highlight){
  var board=loadBoard();board.sort(function(a,b){return b.score-a.score});
  boardBody.innerHTML="";
  if(!board.length){boardBody.innerHTML='<div class="bEmpty">暂无记录<br>快来挑战！</div>';return}
  var top=board.slice(0,12);
  for(var i=0;i<top.length;i++){
    var e=top[i],row=document.createElement("div");
    row.className="bRow"+(highlight&&e.t===highlight.t&&e.name===highlight.name?" me":"");
    var cls=i===0?"g":i===1?"s":i===2?"b":"";
    var rk=i===0?"🥇":i===1?"🥈":i===2?"🥉":"#"+(i+1);
    row.innerHTML='<div class="rk '+cls+'">'+rk+'</div><div class="nm">'+escapeHtml(e.name)+(e.mode==2?' <small style="color:#f9a825">2P</small>':'')+'</div><div class="sv">'+e.score+'</div>';
    boardBody.appendChild(row);
  }
}
function renderBoardFull(target,highlight){
  var board=loadBoard();board.sort(function(a,b){return b.score-a.score});
  target.innerHTML="";
  if(!board.length){target.innerHTML='<div class="bEmpty" style="padding:40px">暂无记录，快来挑战！</div>';return}
  var top=board.slice(0,20);
  for(var i=0;i<top.length;i++){
    var e=top[i],row=document.createElement("div");
    row.className="bRow"+(highlight&&e.t===highlight.t&&e.name===highlight.name?" me":"");
    row.style.gridTemplateColumns="56px 1fr 80px 100px";
    var cls=i===0?"g":i===1?"s":i===2?"b":"";
    var rk=i===0?"🥇":i===1?"🥈":i===2?"🥉":"#"+(i+1);
    row.innerHTML='<div class="rk '+cls+'">'+rk+'</div>'+
      '<div class="nm">'+escapeHtml(e.name)+' <small style="color:'+(e.mode==2?"#f9a825":"#aab")+'">['+(e.mode==2?"双人":"单人")+']</small>'+(e.pass?' <span style="color:#00ff88;font-size:.75rem">✓通关</span>':'')+'</div>'+
      '<div class="sv">'+e.score+'</div>'+
      '<div style="color:#888;font-size:.75rem;text-align:right">'+fmtDate(e.t)+'</div>';
    target.appendChild(row);
  }
}
renderBoardSide();

/* ───────── 屏幕尺寸 ───────── */
function measureScreen(){var r=screen.getBoundingClientRect();GW=r.width;GH=r.height}

/* ───────── 开始游戏 ───────── */
function startGame(){
  showPanel(panelGame);measureScreen();
  var olds=panelGame.querySelectorAll(".shirt,.item,.basket,.spark,.ripple,.floatScore,.cloud,#lidWrap,#lidEnergy");
  for(var i=0;i<olds.length;i++)removeEl(olds[i]);
  shirts=[];keys={};lidOpen=false;lidAngle=0;lidEnergy=1.0;lidLocked=false;lidLockUntil=0;lidLastT=Date.now();
  score=0;combo=0;maxCombo=0;catches=0;misses=0;timeLeft=TOTAL_TIME;
  speedPhase=1.0;wind=0;rushing=false;
  buffs={double:0,freeze:0,scissor:0,clearTill:0};
  elScore.textContent="0";elTime.textContent=TOTAL_TIME;
  elPlayer.textContent=playerName;
  elMode.textContent=mode===2?"🎮 双人模式":"🎮 单人模式";
  el("cardTime").classList.remove("warn");
  windArrow.textContent="·";windText.textContent="无风";windBar.style.opacity=".55";
  buffBar.innerHTML="";rushOv.classList.remove("on");rushText.style.opacity="0";
  comboFloat.style.opacity="0";comboFloat.className="";
  bx=(GW-BW)/2;
  makeBasket();makeClouds();
  if(mode===2){updateLidVisual();}
  lidIndicator.classList.add("hide"); // 始终隐藏文字提示，避免遮挡画面
  running=true;
  clearInterval(timerID);clearTimeout(spawnID);clearTimeout(phaseID);clearTimeout(windID);cancelAnimationFrame(rafID);
  timerID=setInterval(tick,1000);
  schedulePhase();scheduleWind();doSpawn();
  rafID=requestAnimationFrame(loop);
}

function tick(){
  if(!running)return;
  timeLeft--;elTime.textContent=timeLeft;
  if(buffs.double>0){buffs.double--}
  if(buffs.freeze>0){buffs.freeze--}
  if(buffs.scissor>0){buffs.scissor--}
  refreshBuffs();
  if(timeLeft===RUSH_TIME&&!rushing){
    rushing=true;rushOv.classList.add("on");
    rushText.textContent="冲 刺！";rushText.style.opacity="1";sfxRush();
    setTimeout(function(){rushText.style.transition="opacity .8s";rushText.style.opacity="0"},900);
  }
  if(timeLeft<=10){el("cardTime").classList.add("warn");}
  else{el("cardTime").classList.remove("warn")}
  if(timeLeft<=0)endGame();
}

/* 速度阶段：1P 随机变速；2P 线性匀速提速，无突变 */
function schedulePhase(){
  if(!running)return;
  if(rushing){
    speedPhase=1.8; // 冲刺期：纯快速
    phaseID=setTimeout(schedulePhase,800);return;
  }
  if(mode===2){
    // 双人模式：随时间从 1.0 线性匀速提速到 1.55，无随机变化
    var elapsed=TOTAL_TIME-timeLeft;
    var p=Math.min(elapsed/TOTAL_TIME,1);
    speedPhase=1.0+p*0.55;
    phaseID=setTimeout(schedulePhase,400);return;
  }
  // 单人模式：原有随机变速
  var fast=Math.random()<.5;
  if(fast){speedPhase=rand(1.55,2.0);var dur=rand(1500,2500)}
  else{speedPhase=rand(.95,1.15);var dur=rand(2000,3500)}
  phaseID=setTimeout(schedulePhase,dur);
}

function scheduleWind(){
  if(!running)return;
  // 双人模式：完全无风
  if(mode===2){
    wind=0;windText.textContent="双人模式 · 无风";windArrow.textContent="·";windBar.style.opacity=".55";
    return; // 不再重新调度
  }
  var r=Math.random();
  if(r<.45){wind=0;windText.textContent="无风";windArrow.textContent="·";windBar.style.opacity=".55";}
  else if(r<.72){wind=-rand(.8,1.6);windText.textContent="向左 "+Math.abs(wind).toFixed(1);windArrow.textContent="◀";windBar.style.opacity="1";}
  else{wind=rand(.8,1.6);windText.textContent="向右 "+wind.toFixed(1);windArrow.textContent="▶";windBar.style.opacity="1";}
  windID=setTimeout(scheduleWind,rand(3500,6500));
}

/* ───────── 篮子 ───────── */
function makeBasket(){
  var b=document.createElement("div");b.className="basket";b.id="basket";
  b.textContent="🧺";b.style.left=bx+"px";panelGame.appendChild(b);
  if(mode===2){
    var lw=document.createElement("div");lw.id="lidWrap";
    lw.style.left=bx+"px";lw.style.bottom=(18+72)+"px"; // 篮口上方
    lw.innerHTML='<div class="lidL"></div><div class="lidR"></div>';
    panelGame.appendChild(lw);
    // 能量条：篮子下方
    var le=document.createElement("div");le.id="lidEnergy";
    le.style.left=bx+"px";
    le.innerHTML='<div id="lidEnergyFill"></div><div id="lidEnergyLabel">能量 100%</div>';
    panelGame.appendChild(le);
  }
}
function moveBasket(){
  // 单人：← → 或 A D；双人：仅 A D（P1）
  if(mode===1){
    if(keys["arrowleft"]||keys["a"])bx-=BSPD;
    if(keys["arrowright"]||keys["d"])bx+=BSPD;
  } else {
    if(keys["a"])bx-=BSPD;
    if(keys["d"])bx+=BSPD;
    // P2：HOLD 空格 = 开盖；松开 = 瞬间补满；能量归 0 → 锁定 3 秒
    var now=Date.now(); var dt=now-lidLastT; lidLastT=now;
    if(dt<0||dt>200) dt=16;
    var wantOpen=!!keys[" "];
    var newOpen;
    if(lidLocked){
      // 锁定中：强制关盖
      newOpen=false;
      if(now>=lidLockUntil){lidLocked=false;lidEnergy=1.0;}
    } else if(wantOpen && lidEnergy>0){
      // 开盖：消耗能量
      lidEnergy=Math.max(0, lidEnergy - dt/LID_DRAIN_MS);
      newOpen=true;
      if(lidEnergy<=0){
        // 耗尽 → 锁定 3 秒
        lidLocked=true;lidLockUntil=now+LID_LOCK_MS;newOpen=false;
      }
    } else {
      // 关上：能量瞬间补满
      lidEnergy=1.0;newOpen=false;
    }
    if(newOpen!==lidOpen){lidOpen=newOpen;sfxLid();}
    updateLidEnergy();
    updateLidVisual();
  }
  bx=clamp(bx,0,GW-BW);
  var b=document.getElementById("basket");if(b)b.style.left=bx+"px";
  var lw=document.getElementById("lidWrap");if(lw)lw.style.left=bx+"px";
  var le=document.getElementById("lidEnergy");if(le)le.style.left=bx+"px";
}
function updateLidEnergy(){
  var le=document.getElementById("lidEnergy"); if(!le)return;
  var fill=document.getElementById("lidEnergyFill");
  var lbl =document.getElementById("lidEnergyLabel");
  var w;
  if(lidLocked){
    // 锁定期：红色条从 0 充至 1（视觉化 CD 进度）
    var elapsed = LID_LOCK_MS - Math.max(0, lidLockUntil - Date.now());
    w = Math.max(0, Math.min(1, elapsed / LID_LOCK_MS));
  } else {
    w = lidEnergy;
  }
  if(fill)fill.style.width=(w*100).toFixed(1)+"%";
  le.classList.toggle("low", lidOpen && lidEnergy<.4 && !lidLocked);
  le.classList.toggle("cd", lidLocked);
  if(lbl){
    if(lidLocked){
      var remain=Math.max(0,(lidLockUntil-Date.now())/1000);
      lbl.textContent="锁定中 "+remain.toFixed(1)+"s";
    } else {
      lbl.textContent="能量 "+Math.round(lidEnergy*100)+"%";
    }
  }
}
function updateLidVisual(){
  // 仅控制盖子开合视觉，不再显示文字提示
  var lw=document.getElementById("lidWrap");
  if(lw){if(lidOpen)lw.classList.add("open");else lw.classList.remove("open")}
}

/* ───────── 云 ───────── */
function makeClouds(){
  cloudWrap.innerHTML="";
  for(var i=0;i<4;i++){
    var c=document.createElement("div");c.className="cloud";
    var size=80+Math.random()*70;
    c.style.cssText="position:absolute;width:"+size+"px;height:"+(size*.55)+"px;border-radius:50%;background:radial-gradient(circle at 30% 40%,rgba(255,255,255,.18),rgba(255,255,255,.06));top:"+(50+Math.random()*140)+"px;left:"+(Math.random()*GW)+"px;filter:blur(2px);";
    cloudWrap.appendChild(c);
  }
}
function moveClouds(){
  var cs=cloudWrap.children;
  for(var i=0;i<cs.length;i++){var elc=cs[i],x=parseFloat(elc.style.left);x+=wind*.6+.2;if(x>GW)x=-120;if(x<-120)x=GW;elc.style.left=x+"px";}
}

/* ───────── 生成 ───────── */
function doSpawn(){
  if(!running)return;
  if(Date.now()<buffs.clearTill){spawnID=setTimeout(doSpawn,200);return}
  var r=Math.random();
  // 双人模式难度更高，剪刀更常出现；单人模式同步提升剪刀概率
  var scissorRate = mode===2 ? 0.18 : 0.15;
  var giftEnd     = scissorRate + 0.08;
  if(r<scissorRate)spawnItem("scissor");
  else if(r<giftEnd)spawnItem("gift");
  else spawnShirt();
  var t=TOTAL_TIME-timeLeft;
  // 提升非冲刺期间的生成密度
  var base=t<10?340:t<20?260:220;
  if(rushing)base*=.5; // 冲刺期：生成更密集
  if(buffs.freeze>0)base*=1.35;
  spawnID=setTimeout(doSpawn,base+rand(-60,90));
}
function spawnShirt(){
  var r=Math.random();
  var isGold=false,color,base,html;
  if(r<0.10){            // 10% 黑色（仅视觉变体，+1 分）
    color="#1a1a1a";base=1.05;
    html=shirtSvg(color,"crew",false);
  } else if(r<0.22){     // 12% 金色（+2 分）
    isGold=true;color="#ffd700";base=1.0;
    html=goldShirtSvg();
  } else {               // 78% 常规彩色（+1 分）
    var d=pick(REG_DESIGNS);color=pick(COLORS);base=d.base;
    html=d.fn(color);
  }
  var x=rand(10,GW-90);
  var personal=base*rand(.9,1.25);
  var baseSpd=4.2*personal;
  var e=document.createElement("div");
  e.className="shirt"+(isGold?" gold":"");
  e.style.left=x+"px";e.style.top="-80px";e.style.color=color;
  e.innerHTML=html;panelGame.appendChild(e);
  shirts.push({type:"shirt",el:e,x:x,y:-80,baseSpd:baseSpd,vx:0,
    good:true,gold:isGold,color:color,rot:0,rotSpd:(Math.random()-.5)*2.6,bouncing:false});
}
function spawnItem(kind){
  var x=rand(20,GW-80);
  var e=document.createElement("div");e.className="item";e.style.left=x+"px";e.style.top="-70px";
  e.textContent=kind==="scissor"?"✂️":"🎁";panelGame.appendChild(e);
  shirts.push({type:"item",kind:kind,el:e,x:x,y:-70,baseSpd:3.0*rand(.9,1.15),vx:0,good:true,color:kind==="scissor"?"#ff7e5f":"#ffd700",rot:0,rotSpd:0,bouncing:false});
}

/* ───────── 主循环 ───────── */
function loop(){if(!running)return;moveBasket();moveClouds();moveShirts();rafID=requestAnimationFrame(loop)}
function moveShirts(){
  var BY=GH-72;
  var slowed=buffs.freeze>0;
  var freezeMul=slowed?.45:1;
  // 冲刺期：纯快速；不叠加随机变化（speedPhase 由 schedulePhase 已锁定 1.8）
  for(var i=shirts.length-1;i>=0;i--){
    var s=shirts[i];
    if(s.bouncing){
      s.x+=s.bvx;s.y+=s.bvy;s.bvy+=.4;s.rot+=s.rotSpd*2;
      s.el.style.left=s.x+"px";s.el.style.top=s.y+"px";s.el.style.transform="rotate("+s.rot+"deg)";
      s.el.style.opacity=Math.max(0,1-(s.y-BY)/120)+"";
      if(s.y>GH+80){removeEl(s.el);shirts.splice(i,1)}continue;
    }
    if(Date.now()<buffs.clearTill){poof(s.x+30,s.y+30,s.color);removeEl(s.el);shirts.splice(i,1);continue}
    var spd=s.baseSpd*speedPhase*freezeMul;
    // 速度下限：非减速状态下，最慢也要达到"正常"基线（避免感觉过慢）
    if(!slowed && spd<NORMAL_SPD) spd=NORMAL_SPD;
    s.y+=spd;
    var windAcc=wind*.5*(s.type==="item"?.6:1);
    s.vx+=windAcc*.05;s.vx*=.97;s.x+=s.vx;
    if(s.x<-20){s.x=-20;s.vx=Math.abs(s.vx)*.3}
    if(s.x>GW-50){s.x=GW-50;s.vx=-Math.abs(s.vx)*.3}
    s.rot+=s.rotSpd;
    s.el.style.left=s.x+"px";s.el.style.top=s.y+"px";s.el.style.transform="rotate("+s.rot+"deg)";

    var sc=s.x+(s.type==="item"?35:39);
    var bl=bx,br=bx+BW;
    if(s.y+60>=BY && s.y<BY+50 && sc>=bl && sc<=br){
      // 双人模式：关闭状态下不接
      if(mode===2 && !lidOpen){
        // 让它继续掉落（不消除），下一帧会继续下落，可能掉出底部
        // 但要避免重复触发：标记已"穿过"，简单处理：继续下落即可（不 remove），无 action
      } else {
        removeEl(s.el);shirts.splice(i,1);
        onCatch(s,sc,BY);continue;
      }
    }
    if(s.y>GH){
      removeEl(s.el);shirts.splice(i,1);
      if(s.type==="shirt"&&s.good){
        // 双人模式下因盖子关闭而漏接：也算 miss（按用户期待，盖子是策略）
        // 漏接不打断连击：保留 combo
        misses++;sfxMiss();shakeBasket();
      }
    }
  }
}

/* ───────── 命中 ───────── */
function onCatch(s,cx,cy){
  if(s.type==="item"){
    sfxItem();
    if(s.kind==="scissor"){triggerClearScreen();floatTextAt(cx,cy,"✂️ 清屏!","#ff7e5f");burst(cx,cy,"#ff7e5f",true,3)}
    else{var r=Math.random();
      // 礼盒概率分布：进一步降低扣分/冰冻/剪刀概率
      if(r<.33){       // 33% +2 分
        score+=2;refreshScore();floatTextAt(cx,cy,"🎁 +2 分!","#ffd700");burst(cx,cy,"#ffd700",true,2);
      } else if(r<.60){ // 27% +5 分
        score+=5;refreshScore();floatTextAt(cx,cy,"🎁 +5 分!","#ffd700");burst(cx,cy,"#ffd700",true,3);
      } else if(r<.83){ // 23% 双倍 3s
        buffs.double=3;refreshBuffs();floatTextAt(cx,cy,"🎁 双倍 3s!","#ffd700");burst(cx,cy,"#ffd700",true,3);
      } else if(r<.90){ // 7% 剪刀清屏
        triggerClearScreen();floatTextAt(cx,cy,"🎁 剪刀!","#ff7e5f");burst(cx,cy,"#ff7e5f",true,3);
      } else if(r<.96){ // 6% 冰冻 3s
        buffs.freeze=3;refreshBuffs();floatTextAt(cx,cy,"🎁 冰冻 3s!","#00d2ff");burst(cx,cy,"#00d2ff",true,3);
      } else if(r<.99){ // 3% -2 分
        score=Math.max(0,score-2);refreshScore();combo=0;refreshCombo();floatTextAt(cx,cy,"💀 -2 分!","#ff4d6d");burst(cx,cy,"#ff4d6d",true,3);screenFlash("#ff4d6d33");sfxMiss();shakeBasket();
      } else {          // 1% -4 分
        score=Math.max(0,score-4);refreshScore();combo=0;refreshCombo();floatTextAt(cx,cy,"💀 -4 分!","#ff1744");burst(cx,cy,"#ff1744",true,4);screenFlash("#ff174455");sfxMiss();shakeBasket();
      }
    }
    pulseBasket(true);return;
  }
  if(s.good){
    combo++;catches++;if(combo>maxCombo)maxCombo=combo;
    var basePts=s.gold?2:1;
    var pts=basePts;if(buffs.double>0)pts*=2;
    score+=pts;refreshScore();refreshCombo();
    sfxCatch(true);if(combo>1&&combo%5===0)sfxCombo(Math.min(Math.floor(combo/5)+1,5));
    floatTextAt(cx,cy,(s.gold?"⭐ ":"")+(buffs.double>0?"x2 ":"")+"+"+pts,s.gold?"#ffd700":s.color);
    burst(cx,cy,s.gold?"#ffd700":s.color,true,1+(s.gold?1:0));pulseBasket(true);
    if(combo===COMBO_BONUS_AT){score+=COMBO_BONUS_PTS;refreshScore();showBigCombo("29 连击! +"+COMBO_BONUS_PTS+" 奖励");sfxBreak()}
    else if(combo>0&&combo%5===0)showBigCombo(combo+" 连击！");
  }
}

function triggerClearScreen(){
  for(var i=shirts.length-1;i>=0;i--){var s=shirts[i];poof(s.x+30,s.y+30,s.color);removeEl(s.el)}
  shirts=[];buffs.clearTill=Date.now()+1000;buffs.scissor=1;refreshBuffs();
  combo=0;refreshCombo();
  screenFlash("#ff7e5f33");sfxScissor();
}

/* ───────── HUD ───────── */
function refreshScore(){elScore.textContent=score;elScore.animate([{transform:"scale(1.5)",filter:"brightness(2)"},{transform:"scale(1)",filter:"brightness(1)"}],{duration:200,easing:"ease-out"})}
function refreshCombo(){
  var num=comboFloat.querySelector(".cNum"),tag=comboFloat.querySelector(".cTag");
  num.textContent=combo;
  if(combo===0){comboFloat.style.opacity="0";tag.textContent="";return}
  comboFloat.style.opacity="1";
  comboFloat.className=combo>=20?"fire":combo>=10?"hot":"";
  tag.textContent="";
  num.animate([{transform:"scale(1.4)"},{transform:"scale(1)"}],{duration:200,easing:"ease-out"});
}
function refreshBuffs(){
  buffBar.innerHTML="";
  if(buffs.double>0){var d=document.createElement("div");d.className="buff double";d.textContent="💎 双倍 "+buffs.double+"s";buffBar.appendChild(d)}
  if(buffs.freeze>0){var f=document.createElement("div");f.className="buff freeze";f.textContent="❄ 冰冻 "+buffs.freeze+"s";buffBar.appendChild(f)}
  if(buffs.scissor>0){var s=document.createElement("div");s.className="buff scissor";s.textContent="✂ 清屏 "+buffs.scissor+"s";buffBar.appendChild(s)}
}
function showBigCombo(t){bigCombo.textContent=t;bigCombo.animate([{transform:"translate(-50%,-50%) scale(.4)",opacity:0},{transform:"translate(-50%,-50%) scale(1.3)",opacity:1,offset:.4},{transform:"translate(-50%,-50%) scale(1)",opacity:1,offset:.7},{transform:"translate(-50%,-100px) scale(.9)",opacity:0}],{duration:1300,easing:"ease-out"})}

/* ───────── 特效 ───────── */
function burst(cx,cy,color,good,mult){
  var n=good?6+mult*2:10;
  for(var i=0;i<n;i++){
    var p=document.createElement("div");p.className="spark";
    var sz=4+Math.random()*7;
    p.style.cssText="width:"+sz+"px;height:"+sz+"px;background:"+color+";box-shadow:0 0 10px "+color+";left:"+cx+"px;top:"+cy+"px;";
    panelGame.appendChild(p);
    var ang=(i/n)*Math.PI*2+Math.random()*.4,dist=30+Math.random()*50*(mult||1);
    var tx=Math.cos(ang)*dist,ty=Math.sin(ang)*dist;
    var a=p.animate([{transform:"translate(-50%,-50%) scale(1)",opacity:1},{transform:"translate(calc(-50% + "+tx+"px),calc(-50% + "+ty+"px)) scale(0)",opacity:0}],{duration:420+Math.random()*180,easing:"ease-out"});
    a.onfinish=(function(el){return function(){removeEl(el)}})(p);
  }
  var rp=document.createElement("div");rp.className="ripple";
  rp.style.cssText="left:"+cx+"px;top:"+cy+"px;border-color:"+color+";transform:translate(-50%,-50%);width:10px;height:10px;";
  panelGame.appendChild(rp);
  var ra=rp.animate([{width:"10px",height:"10px",opacity:.9},{width:"100px",height:"100px",opacity:0}],{duration:420,easing:"ease-out"});
  ra.onfinish=function(){removeEl(rp)};
}
function poof(cx,cy,color){burst(cx,cy,color||"#fff",true,1)}
function floatTextAt(cx,cy,txt,color){
  var e=document.createElement("div");e.className="floatScore";
  e.style.cssText="color:"+color+";left:"+cx+"px;top:"+cy+"px;transform:translate(-50%,-50%);";
  e.textContent=txt;panelGame.appendChild(e);
  var a=e.animate([{transform:"translate(-50%,-50%) scale(.8)",opacity:1},{transform:"translate(-50%,-140px) scale(1.2)",opacity:0}],{duration:820,easing:"ease-out"});
  a.onfinish=function(){removeEl(e)};
}
function screenFlash(color){var fl=document.createElement("div");fl.style.cssText="position:absolute;inset:0;background:"+color+";z-index:50;pointer-events:none;";panelGame.appendChild(fl);var a=fl.animate([{opacity:1},{opacity:0}],{duration:220});a.onfinish=function(){removeEl(fl)}}
function pulseBasket(good){var b=document.getElementById("basket");if(!b)return;var c=good?"#ff6ec7":"#ff4444";b.animate([{boxShadow:"0 0 42px "+c,transform:"scaleX(1.14) scaleY(.86)"},{boxShadow:"0 0 24px "+c,transform:"scaleX(1) scaleY(1)"}],{duration:240,easing:"ease-out"})}
function shakeBasket(){var b=document.getElementById("basket");if(!b)return;b.animate([{transform:"translateX(0)"},{transform:"translateX(-12px)"},{transform:"translateX(10px)"},{transform:"translateX(-6px)"},{transform:"translateX(0)"}],{duration:280,easing:"ease-in-out"})}

/* ───────── 结束 ───────── */
function endGame(){
  running=false;clearInterval(timerID);clearTimeout(spawnID);clearTimeout(phaseID);clearTimeout(windID);cancelAnimationFrame(rafID);
  rushOv.classList.remove("on");rushText.style.opacity="0";comboFloat.style.opacity="0";
  for(var i=0;i<shirts.length;i++)removeEl(shirts[i].el);shirts=[];

  var board=loadBoard();
  var prevBest=board.length?Math.max.apply(null,board.map(function(e){return e.score})):0;
  var entry={name:playerName,score:score,t:Date.now(),pass:score>=PASS_SCORE,combo:maxCombo,catches:catches,mode:mode};
  board.push(entry);board.sort(function(a,b){return b.score-a.score});
  if(board.length>50)board=board.slice(0,50);
  saveBoard(board);renderBoardSide(entry);

  var sortedBoard=board.slice();
  var rank=sortedBoard.findIndex(function(e){return e.t===entry.t&&e.name===entry.name&&e.score===entry.score})+1;
  var passed=score>=PASS_SCORE,broke=score>prevBest&&prevBest>0,first=prevBest===0;

  showPanel(panelEnd);
  var t=el("endTitle"),d=el("endDetail");
  var lotteryChances=0;
  if(score>=100){
    lotteryChances=2;
    t.textContent="🏆 太牛了！获得 2 次抽奖机会 🏆";
    t.style.color="#ffd700";t.style.textShadow="0 0 24px #ffd700,0 0 50px #ff6ec7";
  } else if(score>=50){
    lotteryChances=1;
    t.textContent="🎉 挑战成功，获得 1 次抽奖机会 🎉";
    t.style.color="#ffd700";t.style.textShadow="0 0 24px #ffd700";
  } else {
    t.textContent="挑战未完成";t.style.color="#ff6b6b";t.style.textShadow="0 0 18px #ff6b6b";
  }
  d.innerHTML="玩家：<b style='color:#fff'>"+escapeHtml(playerName)+"</b> <span style='color:"+(mode===2?"#f9a825":"#7ad6ff")+"'>["+(mode===2?"双人":"单人")+"模式]</span><br>"+
    "最终得分：<b style='color:#ffd700'>"+score+"</b> 分 &nbsp;｜&nbsp; 目标 "+PASS_SCORE+" 分<br>"+
    "接住：<b style='color:#00d2ff'>"+catches+"</b> 件 &nbsp;｜&nbsp; 漏接：<b style='color:#ff8888'>"+misses+"</b> 件 &nbsp;｜&nbsp; 最高连击：<b style='color:#ff6ec7'>"+maxCombo+"</b><br>"+
    "<span style='color:#aab'>本次排名：<b style='color:#ffd700;font-size:1.6rem'>#"+rank+"</b></span>";

  if(broke||(first&&passed)){showBreakRecord(first?"首 次 上 榜":"打 破 纪 录");sfxBreak();fireworks()}
}
function showBreakRecord(t){var w=document.createElement("div");w.className="breakRec";var s=document.createElement("span");s.textContent=t;w.appendChild(s);panelEnd.appendChild(w);setTimeout(function(){w.style.transition="opacity .8s";w.style.opacity="0";setTimeout(function(){removeEl(w)},900)},2400)}
function fireworks(){var colors=["#ffd700","#ff6ec7","#00d2ff","#00ff88","#f9a825"];for(var k=0;k<6;k++)(function(delay){setTimeout(function(){var cx=rand(100,panelEnd.clientWidth-100),cy=rand(80,panelEnd.clientHeight*.6),col=pick(colors);for(var i=0;i<24;i++){var p=document.createElement("div");p.className="firework";p.style.cssText="left:"+cx+"px;top:"+cy+"px;background:"+col+";box-shadow:0 0 12px "+col+";";panelEnd.appendChild(p);var ang=(i/24)*Math.PI*2,dist=90+Math.random()*70;var a=p.animate([{transform:"translate(-50%,-50%)",opacity:1},{transform:"translate("+(Math.cos(ang)*dist-4)+"px,"+(Math.sin(ang)*dist-4)+"px)",opacity:0}],{duration:900,easing:"ease-out"});a.onfinish=(function(el){return function(){removeEl(el)}})(p)}},delay)})(k*220)}

addEventListener("resize",function(){if(running){measureScreen();bx=clamp(bx,0,GW-BW)}});

})();
</script>
</body>
