<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>A4照片排版工具</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            height: 100%;
            height: -webkit-fill-available;
            overflow: hidden;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            color: #1e293b;
            display: flex;
            flex-direction: column;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }
        .toolbar {
            background: #fff;
            padding: 4px 6px;
            border-bottom: 1px solid #e2e8f0;
            flex-shrink: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .toolbar-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 4px 6px;
        }
        .toolbar-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 2px 4px;
        }
        .toolbar-group label {
            font-size: 10px;
            color: #475569;
            white-space: nowrap;
        }
        .toolbar-group input[type="number"] {
            width: 32px;
            padding: 2px 0;
            font-size: 10px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            text-align: center;
            background: #f8fafc;
            outline: none;
        }
        .toolbar-group input[type="number"]:focus {
            border-color: #3b82f6;
        }
        .toolbar-group .unit {
            font-size: 9px;
            color: #94a3b8;
            margin-left: -2px;
            margin-right: 2px;
        }
        .btn {
            padding: 4px 10px;
            font-size: 11px;
            font-weight: 500;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #f1f5f9;
            color: #1e293b;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            touch-action: manipulation;
        }
        .btn:active { transform: scale(0.95); }
        .btn-primary { background: #3b82f6; color: #fff; }
        .btn-success { background: #22c55e; color: #fff; }
        .btn-outline { background: transparent; border: 1px solid #d1d5db; }
        .btn-danger { background: #ef4444; color: #fff; }
        .btn-sm { padding: 2px 6px; font-size: 10px; }
        .btn-group {
            display: flex;
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid #d1d5db;
            background: #fff;
        }
        .btn-group .btn {
            border-radius: 0;
            border: none;
            background: #fff;
            padding: 2px 8px;
            font-size: 10px;
        }
        .btn-group .btn.active { background: #3b82f6; color: #fff; }
        .btn-group .btn:not(:last-child) { border-right: 1px solid #e2e8f0; }
        .file-input-wrap {
            position: relative;
            display: inline-block;
        }
        .file-input-wrap input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }
        .canvas-wrap {
            flex: 1;
            position: relative;
            background: #e8ecf1;
            overflow: hidden;
            cursor: grab;
            touch-action: none;
            user-select: none;
            padding: 0;
        }
        .canvas-wrap:active { cursor: grabbing; }
        .view-wrapper {
            position: absolute;
            left: 0; top: 0;
            width: 100%; height: 100%;
            overflow: hidden;
        }
        .page-container {
            position: absolute;
            left: 0; top: 0;
            background: #fff;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            border-radius: 2px;
            transform-origin: 0 0;
            will-change: transform;
        }
        .page-inner {
            position: relative;
            width: 100%; height: 100%;
            overflow: hidden;
            border-radius: 2px;
            background: #fff;
        }
        .grid-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 2;
        }
        .grid-overlay .cell {
            position: absolute;
            border: 1px dashed rgba(148,163,184,0.40);
            border-radius: 1px;
            pointer-events: none;
            background: rgba(255,255,255,0.02);
        }
        .image-layer {
            position: absolute;
            inset: 0;
            z-index: 1;
        }
        .image-layer .img-cell {
            position: absolute;
            overflow: hidden;
            border-radius: 1px;
            background: #f1f5f9;
            cursor: pointer;
            transition: box-shadow 0.15s;
        }
        .image-layer .img-cell:active {
            box-shadow: inset 0 0 0 2px #3b82f6;
        }
        .image-layer .img-cell .bg-img {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: none;
        }
        .image-layer .img-cell .empty-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            font-size: 18px;
            background: #f8fafc;
            cursor: pointer;
        }
        .page-indicator {
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.50);
            color: #fff;
            font-size: 9px;
            padding: 1px 10px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
            z-index: 5;
            pointer-events: none;
            white-space: nowrap;
        }
        .thumbnails {
            flex-shrink: 0;
            background: #fff;
            border-top: 1px solid #e2e8f0;
            padding: 3px 4px;
            display: flex;
            align-items: center;
            gap: 4px;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            min-height: 38px;
        }
        .thumbnails::-webkit-scrollbar { height: 2px; }
        .thumbnails::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .thumb-item {
            flex: 0 0 32px;
            height: 32px;
            border-radius: 4px;
            overflow: hidden;
            border: 2px solid transparent;
            cursor: pointer;
            transition: 0.15s;
            background: #f1f5f9;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            color: #94a3b8;
        }
        .thumb-item.active {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59,130,246,0.20);
        }
        .thumb-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .thumb-item .thumb-page-num {
            position: absolute;
            bottom: 0px; right: 1px;
            background: rgba(0,0,0,0.60);
            color: #fff;
            font-size: 7px;
            padding: 0 4px;
            border-radius: 4px;
            backdrop-filter: blur(4px);
        }
        .thumb-item .thumb-empty { color: #94a3b8; font-size: 14px; }
        .thumb-add-btn {
            flex: 0 0 32px;
            height: 32px;
            border-radius: 4px;
            border: 2px dashed #d1d5db;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #94a3b8;
            cursor: pointer;
            transition: 0.15s;
        }
        .thumb-add-btn:active { background: #f1f5f9; }
        /* 编辑弹窗 */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15,23,42,0.70);
            backdrop-filter: blur(6px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 12px;
            animation: fadeIn 0.2s ease;
        }
        .modal-overlay.open { display: flex; }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-box {
            background: #fff;
            border-radius: 14px;
            max-width: 480px;
            width: 100%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0,0,0,0.30);
            overflow: hidden;
        }
        .modal-header {
            padding: 8px 14px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .modal-header h3 { font-size: 14px; font-weight: 600; }
        .modal-header .close-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #94a3b8;
            padding: 0 4px;
        }
        .modal-body {
            flex: 1;
            padding: 10px 12px 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 180px;
        }
        .modal-body .crop-container {
            flex: 1;
            position: relative;
            background: #1e293b;
            border-radius: 10px;
            overflow: hidden;
            touch-action: none;
            min-height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-body .crop-container .crop-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-repeat: no-repeat;
            background-position: 50% 50%;
            background-size: cover;
            background-color: #f1f5f9;
            pointer-events: none;
        }
        .modal-body .crop-container .crop-mask {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(255,255,255,0.80);
            border-radius: 4px;
            pointer-events: none;
            box-shadow: none;
        }
        .modal-footer {
            padding: 8px 14px 10px;
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            flex-shrink: 0;
        }
        .modal-footer .btn-rotate { margin-right: auto; }
        @media (max-width: 380px) {
            .toolbar-group label { font-size: 9px; }
            .toolbar-group input[type="number"] { width: 28px; font-size: 9px; }
            .btn { font-size: 10px; padding: 3px 6px; }
            .btn-sm { font-size: 9px; }
            .btn-group .btn { font-size: 9px; padding: 1px 4px; }
            .thumb-item { flex: 0 0 28px; height: 28px; }
            .thumb-add-btn { flex: 0 0 28px; height: 28px; font-size: 14px; }
            .thumbnails { min-height: 32px; padding: 2px 3px; }
        }
        @supports (padding: max(0px)) {
            .toolbar {
                padding-left: max(4px, env(safe-area-inset-left));
                padding-right: max(4px, env(safe-area-inset-right));
                padding-top: max(2px, env(safe-area-inset-top));
            }
            .thumbnails {
                padding-left: max(4px, env(safe-area-inset-left));
                padding-right: max(4px, env(safe-area-inset-right));
                padding-bottom: max(2px, env(safe-area-inset-bottom));
            }
        }
        .btn-hd-pdf { background: #7c3aed; color: #fff; }
        .btn-hd-png { background: #059669; color: #fff; }
        .btn-zoom { background: #e2e8f0; padding: 2px 6px; font-size: 14px; border-radius: 4px; }
        .zoom-indicator { font-size: 10px; color: #475569; min-width: 36px; text-align: center; }
    </style>
</head>
<body>

    <header class="toolbar">
        <div class="toolbar-row">
            <div class="toolbar-group">
                <label>宽</label>
                <input type="number" id="cellW" value="3.2" step="0.1" min="1.5" max="8">
                <span class="unit">cm</span>
                <label>高</label>
                <input type="number" id="cellH" value="3.9" step="0.1" min="1.5" max="8">
                <span class="unit">cm</span>
                <label>间距</label>
                <input type="number" id="cellGap" value="2" step="0.5" min="0" max="8">
                <span class="unit">mm</span>
                <label>白边</label>
                <input type="number" id="whiteMargin" value="2" step="0.5" min="0" max="10">
                <span class="unit">mm</span>
            </div>
            <div class="btn-group" id="typeGroup">
                <button class="btn active" data-type="normal">矩形</button>
                <button class="btn" data-type="polaroid">拍立得</button>
            </div>
        </div>
        <div class="toolbar-row" style="justify-content: center;">
            <div class="file-input-wrap">
                <button class="btn btn-primary">📎 上传</button>
                <input type="file" id="fileInput" accept="image/*" multiple>
            </div>
            <button class="btn btn-hd-pdf" id="hdPdfBtn">📄 高清PDF</button>
            <button class="btn btn-hd-png" id="hdPngBtn">🖼 高清PNG</button>
            <!-- 删除按钮已移至图片弹窗内 -->
            <button class="btn btn-zoom" id="zoomOutBtn">−</button>
            <span class="zoom-indicator" id="zoomIndicator">100%</span>
            <button class="btn btn-zoom" id="zoomInBtn">+</button>
            <button class="btn btn-zoom" id="resetViewBtn" style="font-size:10px;">⟲</button>
        </div>
    </header>

    <div class="main-area">
        <div class="canvas-wrap" id="canvasWrap">
            <div class="view-wrapper" id="viewWrapper">
                <div class="page-container" id="pageContainer">
                    <div class="page-inner" id="pageInner">
                        <div class="image-layer" id="imageLayer"></div>
                        <div class="grid-overlay" id="gridOverlay"></div>
                        <div class="page-indicator" id="pageIndicator">1 / 1</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="thumbnails" id="thumbnails"></div>
    </div>

    <!-- 编辑弹窗 -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-box">
            <div class="modal-header">
                <h3>调整图片位置</h3>
                <button class="close-btn" id="modalClose">✕</button>
            </div>
            <div class="modal-body">
                <div class="crop-container" id="cropContainer">
                    <div class="crop-bg" id="cropBg"></div>
                    <div class="crop-mask" id="cropMask"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-rotate btn-outline" id="rotateBtn">⟳ 旋转</button>
                <button class="btn btn-danger" id="modalDeleteBtn">✕ 删除</button>
                <button class="btn btn-outline" id="modalCancel">取消</button>
                <button class="btn btn-primary" id="modalSave">保存</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ---------- DOM 引用 ----------
            const $ = id => document.getElementById(id);
            const cellWInput = $('cellW');
            const cellHInput = $('cellH');
            const cellGapInput = $('cellGap');
            const whiteMarginInput = $('whiteMargin');
            const typeGroup = $('typeGroup');
            const fileInput = $('fileInput');
            const hdPdfBtn = $('hdPdfBtn');
            const hdPngBtn = $('hdPngBtn');
            const pageContainer = $('pageContainer');
            const pageInner = $('pageInner');
            const imageLayer = $('imageLayer');
            const gridOverlay = $('gridOverlay');
            const pageIndicator = $('pageIndicator');
            const thumbnails = $('thumbnails');
            const editModal = $('editModal');
            const cropBg = $('cropBg');
            const cropContainer = $('cropContainer');
            const cropMask = $('cropMask');
            const modalClose = $('modalClose');
            const modalCancel = $('modalCancel');
            const modalSave = $('modalSave');
            const modalDeleteBtn = $('modalDeleteBtn');
            const rotateBtn = $('rotateBtn');
            const canvasWrap = $('canvasWrap');
            const viewWrapper = $('viewWrapper');
            const zoomOutBtn = $('zoomOutBtn');
            const zoomInBtn = $('zoomInBtn');
            const resetViewBtn = $('resetViewBtn');
            const zoomIndicator = $('zoomIndicator');

            // ---------- localStorage 缓存键 ----------
            const CACHE_KEY = 'a4print_settings';

            function loadSettings() {
                try {
                    const s = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');
                    if (s.cellW !== undefined) cellWInput.value = s.cellW;
                    if (s.cellH !== undefined) cellHInput.value = s.cellH;
                    if (s.cellGap !== undefined) cellGapInput.value = s.cellGap;
                    if (s.whiteMargin !== undefined) whiteMarginInput.value = s.whiteMargin;
                    if (s.type) {
                        state.type = s.type;
                        typeGroup.querySelectorAll('.btn').forEach(b => {
                            b.classList.toggle('active', b.dataset.type === s.type);
                        });
                    }
                } catch(e) {}
            }

            function saveSettings() {
                try {
                    localStorage.setItem(CACHE_KEY, JSON.stringify({
                        cellW: cellWInput.value,
                        cellH: cellHInput.value,
                        cellGap: cellGapInput.value,
                        whiteMargin: whiteMarginInput.value,
                        type: state.type,
                    }));
                } catch(e) {}
            }

            // ---------- 状态 ----------
            // pages 中每个 slot 可以是 imgId 或 null（已删除/空）
            // images 存储 { id, dataUrl（高质量，用于导出）, previewUrl（低质量，用于预览）, ox, oy, scale, imgW, imgH }
            const state = {
                type: 'normal',
                images: [],
                pages: [],          // [{ slots: [imgId|null, ...] }]
                currentPage: 0,
                nextId: 1,
                selectedImageId: null,
                viewScale: 1,
                viewTranslateX: 0,
                viewTranslateY: 0,
            };

            // ---------- 工具 ----------
            function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
            function mmToPx(mm, dpi) { return mm * dpi / 25.4; }
            function cmToPx(cm, dpi) { return cm * dpi / 2.54; }

            const A4_W_MM = 210;
            const A4_H_MM = 297;
            const BASE_DPI = 96;

            // ---------- 生成低分辨率预览图（节省内存，减少卡顿） ----------
            function makePreviewUrl(dataUrl, imgW, imgH, maxPx) {
                maxPx = maxPx || 400;
                return new Promise(resolve => {
                    const img = new Image();
                    img.onload = function() {
                        const scale = Math.min(1, maxPx / Math.max(img.width, img.height));
                        const w = Math.round(img.width * scale);
                        const h = Math.round(img.height * scale);
                        const canvas = document.createElement('canvas');
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.75));
                    };
                    img.onerror = () => resolve(dataUrl);
                    img.src = dataUrl;
                });
            }

            // ---------- 布局计算 ----------
            function calcLayout() {
                const cw = parseFloat(cellWInput.value) || 3.2;
                const ch = parseFloat(cellHInput.value) || 3.9;
                const gap = parseFloat(cellGapInput.value) || 2;
                const wm = parseFloat(whiteMarginInput.value) || 2;
                const type = state.type;
                const margin_mm = 5;

                const cellW_mm = cw * 10;
                const cellH_mm = ch * 10;
                const gap_mm = gap;
                const whiteMargin_mm = wm;

                const availW = A4_W_MM - 2 * margin_mm;
                const availH = A4_H_MM - 2 * margin_mm;

                let cols = Math.floor((availW + gap_mm) / (cellW_mm + gap_mm));
                let rows = Math.floor((availH + gap_mm) / (cellH_mm + gap_mm));
                if (cols < 1) cols = 1;
                if (rows < 1) rows = 1;

                const totalW = cols * (cellW_mm + gap_mm) - gap_mm;
                const totalH = rows * (cellH_mm + gap_mm) - gap_mm;
                const offsetX = margin_mm + (availW - totalW) / 2;
                const offsetY = margin_mm + (availH - totalH) / 2;

                let imgOffsetX_mm = 0, imgOffsetY_mm = 0;
                let imgW_mm = cellW_mm, imgH_mm = cellH_mm;
                if (type === 'polaroid') {
                    const topLeftMargin = whiteMargin_mm;
                    const bottomMargin = 4 * whiteMargin_mm;
                    imgOffsetX_mm = topLeftMargin;
                    imgOffsetY_mm = topLeftMargin;
                    imgW_mm = cellW_mm - 2 * topLeftMargin;
                    imgH_mm = cellH_mm - topLeftMargin - bottomMargin;
                    if (imgW_mm < 1) imgW_mm = 1;
                    if (imgH_mm < 1) imgH_mm = 1;
                }

                return {
                    cols, rows, cellW_mm, cellH_mm, gap_mm, offsetX, offsetY,
                    totalW, totalH, margin_mm, type, whiteMargin_mm,
                    imgOffsetX_mm, imgOffsetY_mm, imgW_mm, imgH_mm,
                    cellW_px: cmToPx(cw, BASE_DPI),
                    cellH_px: cmToPx(ch, BASE_DPI),
                    gap_px: mmToPx(gap, BASE_DPI),
                    offsetX_px: mmToPx(offsetX, BASE_DPI),
                    offsetY_px: mmToPx(offsetY, BASE_DPI),
                    imgOffsetX_px: mmToPx(imgOffsetX_mm, BASE_DPI),
                    imgOffsetY_px: mmToPx(imgOffsetY_mm, BASE_DPI),
                    imgW_px: mmToPx(imgW_mm, BASE_DPI),
                    imgH_px: mmToPx(imgH_mm, BASE_DPI),
                    pageW_px: mmToPx(A4_W_MM, BASE_DPI),
                    pageH_px: mmToPx(A4_H_MM, BASE_DPI),
                };
            }

            // ---------- 视图边界约束 ----------
            function applyBoundaryConstraints() {
                const wrapperRect = viewWrapper.getBoundingClientRect();
                const pageW = state._pageW || mmToPx(A4_W_MM, BASE_DPI);
                const pageH = state._pageH || mmToPx(A4_H_MM, BASE_DPI);
                const scale = state.viewScale;
                const scaledW = pageW * scale;
                const scaledH = pageH * scale;
                const vw = wrapperRect.width;
                const vh = wrapperRect.height;
                const baseX = (vw - pageW) / 2;
                const baseY = (vh - pageH) / 2;
                let tx = baseX + state.viewTranslateX;
                let ty = baseY + state.viewTranslateY;
                if (scaledW < vw) { tx = (vw - scaledW) / 2; }
                else { tx = clamp(tx, vw - scaledW, 0); }
                if (scaledH < vh) { ty = (vh - scaledH) / 2; }
                else { ty = clamp(ty, vh - scaledH, 0); }
                state.viewTranslateX = tx - baseX;
                state.viewTranslateY = ty - baseY;
            }

            function updateViewTransform() {
                applyBoundaryConstraints();
                const wrapperRect = viewWrapper.getBoundingClientRect();
                const pageW = state._pageW || mmToPx(A4_W_MM, BASE_DPI);
                const pageH = state._pageH || mmToPx(A4_H_MM, BASE_DPI);
                const baseX = (wrapperRect.width - pageW) / 2;
                const baseY = (wrapperRect.height - pageH) / 2;
                const tx = baseX + state.viewTranslateX;
                const ty = baseY + state.viewTranslateY;
                pageContainer.style.transform = `translate(${tx}px, ${ty}px) scale(${state.viewScale})`;
                zoomIndicator.textContent = Math.round(state.viewScale * 100) + '%';
            }

            // ---------- 渲染 ----------
            function render(noScale) {
                const layout = calcLayout();
                const { cols, rows, cellW_px, cellH_px, gap_px, offsetX_px, offsetY_px,
                    pageW_px, pageH_px, imgOffsetX_px, imgOffsetY_px, imgW_px, imgH_px, type } = layout;
                const pageCount = state.pages.length || 1;

                state._pageW = pageW_px;
                state._pageH = pageH_px;

                pageInner.style.width = pageW_px + 'px';
                pageInner.style.height = pageH_px + 'px';
                pageContainer.style.width = pageW_px + 'px';
                pageContainer.style.height = pageH_px + 'px';
                window._lastLayout = layout;

                imageLayer.innerHTML = '';
                gridOverlay.innerHTML = '';

                const pageIdx = Math.min(state.currentPage, pageCount - 1);
                const pageData = state.pages[pageIdx] || { slots: [] };
                const slots = pageData.slots || [];

                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        const x = offsetX_px + c * (cellW_px + gap_px);
                        const y = offsetY_px + r * (cellH_px + gap_px);
                        const idx = r * cols + c;

                        const cellDiv = document.createElement('div');
                        cellDiv.className = 'cell';
                        cellDiv.style.cssText = `left:${x}px;top:${y}px;width:${cellW_px}px;height:${cellH_px}px`;
                        gridOverlay.appendChild(cellDiv);

                        const imgCell = document.createElement('div');
                        imgCell.className = 'img-cell';
                        let left = x, top = y, width = cellW_px, height = cellH_px;
                        if (type === 'polaroid') {
                            left = x + imgOffsetX_px;
                            top = y + imgOffsetY_px;
                            width = imgW_px;
                            height = imgH_px;
                        }
                        imgCell.style.cssText = `left:${left}px;top:${top}px;width:${width}px;height:${height}px`;
                        imgCell.dataset.index = idx;

                        const imgId = (idx < slots.length) ? slots[idx] : null;
                        if (imgId !== null && imgId !== undefined) {
                            const imgData = state.images.find(im => im.id === imgId);
                            if (imgData) {
                                // 使用预览图显示，节省内存
                                const previewSrc = imgData.previewUrl || imgData.dataUrl;
                                const ox = imgData.ox || 0.5;
                                const oy = imgData.oy || 0.5;
                                const sc = imgData.scale || 1;
                                const bgDiv = document.createElement('div');
                                bgDiv.className = 'bg-img';
                                bgDiv.style.backgroundImage = 'url(' + previewSrc + ')';
                                // scale>=1 时在 cover 基础上放大；backgroundSize 用百分比
                                bgDiv.style.backgroundSize = (sc * 100) + '%';
                                bgDiv.style.backgroundPosition = (ox * 100) + '% ' + (oy * 100) + '%';
                                imgCell.appendChild(bgDiv);
                                imgCell.dataset.imgId = imgId;
                                if (!noScale) {
                                    imgCell.addEventListener('click', function(e) {
                                        e.stopPropagation();
                                        openEditor(parseInt(this.dataset.index));
                                    });
                                }
                            } else {
                                // slot 有 id 但 image 已被清除（不应出现）
                                const empty = document.createElement('div');
                                empty.className = 'empty-placeholder';
                                empty.textContent = '+';
                                imgCell.appendChild(empty);
                            }
                        } else {
                            // 空槽
                            const empty = document.createElement('div');
                            empty.className = 'empty-placeholder';
                            empty.dataset.index = idx;
                            empty.dataset.page = pageIdx;
                            empty.textContent = '+';
                            empty.addEventListener('click', function(e) {
                                e.stopPropagation();
                                const idx2 = parseInt(this.dataset.index);
                                const page = parseInt(this.dataset.page);
                                const input = document.createElement('input');
                                input.type = 'file';
                                input.accept = 'image/*';
                                input.style.display = 'none';
                                document.body.appendChild(input);
                                input.click();
                                input.addEventListener('change', function() {
                                    if (this.files.length > 0) {
                                        addImageToSlot(this.files[0], page, idx2);
                                    }
                                    this.remove();
                                });
                                document.addEventListener('focus', function() {
                                    if (input.parentNode) input.remove();
                                }, { once: true });
                            });
                            imgCell.appendChild(empty);
                        }
                        imageLayer.appendChild(imgCell);
                    }
                }

                pageIndicator.textContent = (pageIdx + 1) + ' / ' + pageCount;
                if (!noScale) {
                    renderThumbnails();
                    updateViewTransform();
                }
            }

            // ---------- 缩略图 ----------
            function renderThumbnails() {
                thumbnails.innerHTML = '';
                const pageCount = state.pages.length || 1;
                const current = Math.min(state.currentPage, pageCount - 1);

                for (let i = 0; i < pageCount; i++) {
                    const item = document.createElement('div');
                    item.className = 'thumb-item' + (i === current ? ' active' : '');
                    const pageData = state.pages[i] || { slots: [] };
                    const slots = pageData.slots || [];
                    let thumbUrl = null;
                    for (const id of slots) {
                        if (!id) continue;
                        const img = state.images.find(im => im.id === id);
                        if (img) { thumbUrl = img.previewUrl || img.dataUrl; break; }
                    }
                    if (thumbUrl) {
                        const img = document.createElement('img');
                        img.src = thumbUrl;
                        img.alt = 'page ' + (i + 1);
                        item.appendChild(img);
                    } else {
                        const span = document.createElement('span');
                        span.className = 'thumb-empty';
                        span.textContent = '📄';
                        item.appendChild(span);
                    }
                    const num = document.createElement('span');
                    num.className = 'thumb-page-num';
                    num.textContent = i + 1;
                    item.appendChild(num);
                    item.addEventListener('click', function() {
                        state.currentPage = i;
                        render();
                    });
                    thumbnails.appendChild(item);
                }

                const addBtn = document.createElement('div');
                addBtn.className = 'thumb-add-btn';
                addBtn.textContent = '+';
                addBtn.addEventListener('click', function() {
                    const layout = calcLayout();
                    const perPage = layout.cols * layout.rows;
                    state.pages.push({ slots: new Array(perPage).fill(null) });
                    state.currentPage = state.pages.length - 1;
                    render();
                });
                thumbnails.appendChild(addBtn);

                const activeEl = thumbnails.querySelector('.thumb-item.active');
                if (activeEl) activeEl.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            }

            // ---------- 图片管理 ----------
            // 将 images 数组按顺序填入 pages 的 slots，但保留已有的空槽（已删除的位置不自动补）
            // 重排时：只在上传新图片 / 设置变更时重新分配，删除只清空槽
            function distributeImages() {
                const layout = calcLayout();
                const perPage = layout.cols * layout.rows;

                // 收集所有现有 slots 中的 imgId（保持顺序，空位保留）
                const allSlots = [];
                for (const page of state.pages) {
                    const s = page.slots || [];
                    for (let i = 0; i < perPage; i++) {
                        allSlots.push(s[i] !== undefined ? s[i] : null);
                    }
                }

                // 把所有有效的 imgId 按现有位置提取
                const validIds = state.images.map(im => im.id);
                // 过滤 allSlots 中已不存在的 id（防止悬挂引用）
                const cleanSlots = allSlots.map(id => (id && validIds.includes(id)) ? id : null);

                // 找出当前 images 中在 cleanSlots 没有位置的（新图）
                const placedIds = new Set(cleanSlots.filter(Boolean));
                const newIds = state.images.filter(im => !placedIds.has(im.id)).map(im => im.id);

                // 把 newIds 按序填入 cleanSlots 的空位
                let newPtr = 0;
                for (let i = 0; i < cleanSlots.length && newPtr < newIds.length; i++) {
                    if (cleanSlots[i] === null) {
                        cleanSlots[i] = newIds[newPtr++];
                    }
                }
                // 若还有剩余新图，扩展页面
                while (newPtr < newIds.length) {
                    for (let i = 0; i < perPage && newPtr < newIds.length; i++) {
                        cleanSlots.push(newIds[newPtr++]);
                    }
                    // 补齐最后一页
                    while (cleanSlots.length % perPage !== 0) cleanSlots.push(null);
                }

                // 按 perPage 切分成 pages
                const newPages = [];
                const totalSlots = Math.max(cleanSlots.length, perPage);
                // 确保至少有一页
                const padded = [...cleanSlots];
                while (padded.length < perPage) padded.push(null);
                // 补齐最后一页
                while (padded.length % perPage !== 0) padded.push(null);

                for (let i = 0; i < padded.length; i += perPage) {
                    newPages.push({ slots: padded.slice(i, i + perPage) });
                }
                if (newPages.length === 0) newPages.push({ slots: new Array(perPage).fill(null) });
                state.pages = newPages;
                if (state.currentPage >= state.pages.length) state.currentPage = state.pages.length - 1;
            }

            // 全量重新分配（设置变更时用，丢弃空槽重新紧密排列）
            function redistributeImages() {
                const layout = calcLayout();
                const perPage = layout.cols * layout.rows;
                const ids = state.images.map(im => im.id);
                const newPages = [];
                let i = 0;
                do {
                    const chunk = ids.slice(i, i + perPage);
                    const slots = [...chunk];
                    while (slots.length < perPage) slots.push(null);
                    newPages.push({ slots });
                    i += perPage;
                } while (i < ids.length);
                if (newPages.length === 0) newPages.push({ slots: new Array(perPage).fill(null) });
                state.pages = newPages;
                if (state.currentPage >= state.pages.length) state.currentPage = state.pages.length - 1;
            }

            // 工具：将图片旋转90度，返回新的 dataUrl 和新宽高
            function rotateDataUrl90(dataUrl, srcW, srcH) {
                return new Promise(resolve => {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        canvas.width = srcH;
                        canvas.height = srcW;
                        const ctx = canvas.getContext('2d');
                        ctx.save();
                        ctx.translate(canvas.width / 2, canvas.height / 2);
                        ctx.rotate(90 * Math.PI / 180);
                        ctx.drawImage(img, -srcW / 2, -srcH / 2, srcW, srcH);
                        ctx.restore();
                        resolve({ dataUrl: canvas.toDataURL('image/jpeg', 0.95), w: srcH, h: srcW });
                    };
                    img.onerror = () => resolve({ dataUrl, w: srcW, h: srcH });
                    img.src = dataUrl;
                });
            }

            // 判断图片是否需要旋转以适配格子方向
            function shouldAutoRotate(imgW, imgH) {
                const layout = calcLayout();
                const cellIsPortrait = layout.imgH_mm > layout.imgW_mm;  // 格子是竖向
                const imgIsPortrait = imgH > imgW;                        // 图片是竖向
                return cellIsPortrait !== imgIsPortrait;                   // 方向不一致则旋转
            }

            // 上传多张图片，按 files 选择顺序串行处理保证顺序
            function addImages(files) {
                const fileArray = Array.from(files);
                if (fileArray.length === 0) return;

                // 串行加载保证顺序
                const results = new Array(fileArray.length);
                let pending = fileArray.length;

                function tryFinish() {
                    if (pending > 0) return;
                    // 按索引顺序加入 state.images
                    for (const r of results) {
                        if (r) state.images.push(r);
                    }
                    distributeImages();
                    render();
                }

                fileArray.forEach((file, index) => {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const dataUrl = e.target.result;
                        const img = new Image();
                        const handleLoad = function() {
                            const id = state.nextId++;
                            const w = img.naturalWidth || img.width || 800;
                            const h = img.naturalHeight || img.height || 600;

                            // 判断是否需要自动旋转适配格子方向
                            const needRotate = shouldAutoRotate(w, h);
                            const processPromise = needRotate
                                ? rotateDataUrl90(dataUrl, w, h)
                                : Promise.resolve({ dataUrl, w, h });

                            processPromise.then(({ dataUrl: finalUrl, w: finalW, h: finalH }) => {
                                makePreviewUrl(finalUrl, finalW, finalH, 600).then(previewUrl => {
                                    results[index] = {
                                        id, dataUrl: finalUrl, previewUrl,
                                        ox: 0.5, oy: 0.5, scale: 1,
                                        imgW: finalW, imgH: finalH,
                                    };
                                    pending--;
                                    tryFinish();
                                });
                            });
                        };
                        img.onload = handleLoad;
                        img.onerror = function() {
                            const id = state.nextId++;
                            results[index] = { id, dataUrl, previewUrl: dataUrl, ox: 0.5, oy: 0.5, scale: 1, imgW: 800, imgH: 600 };
                            pending--;
                            tryFinish();
                        };
                        img.src = dataUrl;
                    };
                    reader.onerror = function() { pending--; tryFinish(); };
                    reader.readAsDataURL(file);
                });
            }

            // 向指定槽位上传一张图片
            function addImageToSlot(file, pageIndex, slotIndex) {
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(e) {
                    const dataUrl = e.target.result;
                    const img = new Image();
                    img.onload = function() {
                        const id = state.nextId++;
                        const w = img.width, h = img.height;
                        const needRotate = shouldAutoRotate(w, h);
                        const processPromise = needRotate
                            ? rotateDataUrl90(dataUrl, w, h)
                            : Promise.resolve({ dataUrl, w, h });
                        processPromise.then(({ dataUrl: finalUrl, w: finalW, h: finalH }) => {
                            makePreviewUrl(finalUrl, finalW, finalH, 600).then(previewUrl => {
                                const newImg = { id, dataUrl: finalUrl, previewUrl, ox: 0.5, oy: 0.5, scale: 1, imgW: finalW, imgH: finalH };
                                state.images.push(newImg);
                                // 确保页面存在
                                while (state.pages.length <= pageIndex) {
                                    const layout = calcLayout();
                                    state.pages.push({ slots: new Array(layout.cols * layout.rows).fill(null) });
                                }
                                const page = state.pages[pageIndex];
                                const layout = calcLayout();
                                const perPage = layout.cols * layout.rows;
                                while (page.slots.length < perPage) page.slots.push(null);
                                if (slotIndex < page.slots.length) {
                                    page.slots[slotIndex] = id;
                                }
                                render();
                            });
                        });
                    };
                    img.onerror = function() {
                        const id = state.nextId++;
                        const newImg = { id, dataUrl, previewUrl: dataUrl, ox: 0.5, oy: 0.5, scale: 1, imgW: 800, imgH: 600 };
                        state.images.push(newImg);
                        while (state.pages.length <= pageIndex) {
                            const layout = calcLayout();
                            state.pages.push({ slots: new Array(layout.cols * layout.rows).fill(null) });
                        }
                        const page = state.pages[pageIndex];
                        const layout = calcLayout();
                        const perPage = layout.cols * layout.rows;
                        while (page.slots.length < perPage) page.slots.push(null);
                        if (slotIndex < page.slots.length) page.slots[slotIndex] = id;
                        render();
                    };
                    img.src = dataUrl;
                };
                reader.readAsDataURL(file);
            }

            // 删除指定 id 的图片（只清空槽位，后面的不补前）
            function deleteImageById(imgId) {
                if (!imgId) return;
                const idx = state.images.findIndex(im => im.id === imgId);
                if (idx === -1) return;
                if (!confirm('确定删除这张图片吗？')) return;
                state.images.splice(idx, 1);
                // 仅清空对应槽位，不重新分配
                for (const page of state.pages) {
                    for (let i = 0; i < page.slots.length; i++) {
                        if (page.slots[i] === imgId) page.slots[i] = null;
                    }
                }
                state.selectedImageId = null;
                render();
            }

            // ---------- 编辑弹窗 ----------
            let editCellIndex = -1;
            let editImageId = null;
            let editOx = 0.5, editOy = 0.5, editScale = 1;
            let transformFrameId = null;

            function openEditor(cellIndex) {
                const pageIdx = Math.min(state.currentPage, state.pages.length - 1);
                const pageData = state.pages[pageIdx] || { slots: [] };
                const slots = pageData.slots || [];
                const imgId = slots[cellIndex];
                if (!imgId) return;
                const imgData = state.images.find(im => im.id === imgId);
                if (!imgData) return;
                state.selectedImageId = imgId;

                editCellIndex = cellIndex;
                editImageId = imgId;
                editOx = imgData.ox || 0.5;
                editOy = imgData.oy || 0.5;
                editScale = imgData.scale || 1;

                // 弹窗中使用高质量原图预览
                cropBg.style.backgroundImage = 'url(' + imgData.dataUrl + ')';
                applyEditTransform();

                const layout = calcLayout();
                const isPolaroid = (layout.type === 'polaroid');
                let ratioW = isPolaroid ? layout.imgW_px : layout.cellW_px;
                let ratioH = isPolaroid ? layout.imgH_px : layout.cellH_px;
                if (ratioW < 1) ratioW = 1;
                if (ratioH < 1) ratioH = 1;

                cropContainer.style.aspectRatio = ratioW / ratioH;
                cropContainer.style.width = '100%';
                cropContainer.style.height = '100%';
                cropContainer.style.maxHeight = '100%';
                cropContainer.style.alignSelf = 'center';
                cropMask.style.width = '100%';
                cropMask.style.height = '100%';
                cropMask.style.top = '0';
                cropMask.style.left = '0';
                cropMask.style.transform = 'none';
                cropMask.style.margin = '0';

                editModal.classList.add('open');
                document.body.style.overflow = 'hidden';
            }

            function applyEditTransform() {
                if (transformFrameId) { cancelAnimationFrame(transformFrameId); transformFrameId = null; }
                transformFrameId = requestAnimationFrame(() => {
                    const ox = editOx || 0.5;
                    const oy = editOy || 0.5;
                    const sc = editScale || 1;
                    // cover 基础上再乘以 scale：
                    // background-size: cover 等价于 "图片填满容器不留白"
                    // 用 sc * 100% 可以让用户放大/缩小裁剪范围
                    // 为保证不小于 cover，sc 最小值限制在 1（由 clamp 保证）
                    cropBg.style.backgroundSize = (sc * 100) + '%';
                    cropBg.style.backgroundPosition = (ox * 100) + '% ' + (oy * 100) + '%';
                    transformFrameId = null;
                });
            }

            function rotateImage() {
                if (editImageId === null) return;
                const imgData = state.images.find(im => im.id === editImageId);
                if (!imgData) return;

                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const w = img.width, h = img.height;
                    canvas.width = h;
                    canvas.height = w;
                    ctx.save();
                    ctx.translate(canvas.width / 2, canvas.height / 2);
                    ctx.rotate(90 * Math.PI / 180);
                    ctx.drawImage(img, -w / 2, -h / 2, w, h);
                    ctx.restore();
                    const newDataUrl = canvas.toDataURL('image/jpeg', 0.95);
                    imgData.dataUrl = newDataUrl;
                    imgData.imgW = h;
                    imgData.imgH = w;
                    // 重新生成预览图
                    makePreviewUrl(newDataUrl, h, w, 600).then(p => {
                        imgData.previewUrl = p;
                        cropBg.style.backgroundImage = 'url(' + newDataUrl + ')';
                        applyEditTransform();
                    });
                };
                img.src = imgData.dataUrl;
                if (img.complete && img.naturalWidth > 0) img.onload();
            }

            function closeEditor(save) {
                if (save && editImageId !== null) {
                    const imgData = state.images.find(im => im.id === editImageId);
                    if (imgData) {
                        imgData.ox = clamp(editOx, 0, 1);
                        imgData.oy = clamp(editOy, 0, 1);
                        imgData.scale = Math.max(1, editScale);
                        render();
                    }
                }
                editModal.classList.remove('open');
                document.body.style.overflow = '';
                editImageId = null;
                editCellIndex = -1;
                cropBg.style.backgroundImage = '';
                cropBg.style.backgroundSize = '100%';
                cropBg.style.backgroundPosition = '50% 50%';
                cropContainer.style.aspectRatio = '';
                cropContainer.style.maxHeight = '';
                cropContainer.style.alignSelf = '';
                cropMask.style.width = '';
                cropMask.style.height = '';
                cropMask.style.top = '';
                cropMask.style.left = '';
                cropMask.style.transform = '';
                cropMask.style.margin = '';
                if (transformFrameId) { cancelAnimationFrame(transformFrameId); transformFrameId = null; }
            }

            // ---------- 手势控制（编辑弹窗） ----------
            function setupEditGestures() {
                let startPos = null;
                let startOx = 0.5, startOy = 0.5;
                let pinchStartDist = 0, pinchStartScale = 1;
                let pinchStartCx = 0, pinchStartCy = 0, pinchStartOx = 0.5, pinchStartOy = 0.5;

                cropContainer.addEventListener('touchstart', function(e) {
                    if (e.touches.length === 1) {
                        const t = e.touches[0];
                        startPos = { x: t.clientX, y: t.clientY };
                        startOx = editOx; startOy = editOy;
                    } else if (e.touches.length === 2) {
                        const t1 = e.touches[0], t2 = e.touches[1];
                        pinchStartDist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
                        pinchStartScale = editScale;
                        pinchStartCx = (t1.clientX + t2.clientX) / 2;
                        pinchStartCy = (t1.clientY + t2.clientY) / 2;
                        pinchStartOx = editOx;
                        pinchStartOy = editOy;
                    }
                    e.preventDefault();
                }, { passive: false });

                cropContainer.addEventListener('touchmove', function(e) {
                    if (e.touches.length === 1) {
                        const t = e.touches[0];
                        const rect = cropContainer.getBoundingClientRect();
                        editOx = clamp(startOx + (t.clientX - startPos.x) / rect.width * 0.8, 0, 1);
                        editOy = clamp(startOy + (t.clientY - startPos.y) / rect.height * 0.8, 0, 1);
                        applyEditTransform();
                        e.preventDefault();
                    } else if (e.touches.length === 2) {
                        const t1 = e.touches[0], t2 = e.touches[1];
                        const dist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
                        if (pinchStartDist > 0) {
                            editScale = clamp(pinchStartScale * dist / pinchStartDist, 1, 5);
                        }
                        const cx = (t1.clientX + t2.clientX) / 2;
                        const cy = (t1.clientY + t2.clientY) / 2;
                        const rect = cropContainer.getBoundingClientRect();
                        editOx = clamp(pinchStartOx + (cx - pinchStartCx) / rect.width * 0.4, 0, 1);
                        editOy = clamp(pinchStartOy + (cy - pinchStartCy) / rect.height * 0.4, 0, 1);
                        applyEditTransform();
                        e.preventDefault();
                    }
                }, { passive: false });

                cropContainer.addEventListener('touchend', function() {}, { passive: true });

                let isMouseDown = false, mouseStartX = 0, mouseStartY = 0, mouseStartOx = 0.5, mouseStartOy = 0.5;
                cropContainer.addEventListener('mousedown', function(e) {
                    if (e.button !== 0) return;
                    isMouseDown = true;
                    mouseStartX = e.clientX; mouseStartY = e.clientY;
                    mouseStartOx = editOx; mouseStartOy = editOy;
                    e.preventDefault();
                });
                document.addEventListener('mousemove', function(e) {
                    if (!isMouseDown) return;
                    const rect = cropContainer.getBoundingClientRect();
                    editOx = clamp(mouseStartOx + (e.clientX - mouseStartX) / rect.width * 0.8, 0, 1);
                    editOy = clamp(mouseStartOy + (e.clientY - mouseStartY) / rect.height * 0.8, 0, 1);
                    applyEditTransform();
                });
                document.addEventListener('mouseup', function() { isMouseDown = false; });

                // 鼠标滚轮缩放
                cropContainer.addEventListener('wheel', function(e) {
                    e.preventDefault();
                    const delta = e.deltaY > 0 ? -0.05 : 0.05;
                    editScale = clamp(editScale + delta, 1, 5);
                    applyEditTransform();
                }, { passive: false });
            }

            // ---------- 高清导出核心 ----------
            function loadImage(dataUrl) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.onerror = () => reject(new Error('load image failed'));
                    img.src = dataUrl;
                });
            }

            async function renderPageToCanvas(pageIndex, dpi) {
                dpi = dpi || 600;
                const pageW = mmToPx(A4_W_MM, dpi);
                const pageH = mmToPx(A4_H_MM, dpi);
                const canvas = document.createElement('canvas');
                canvas.width = pageW;
                canvas.height = pageH;
                const ctx = canvas.getContext('2d');
                ctx.imageSmoothingQuality = 'high';
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, pageW, pageH);

                const pageData = state.pages[pageIndex] || { slots: [] };
                const slots = pageData.slots || [];

                const cw = parseFloat(cellWInput.value) || 3.2;
                const ch = parseFloat(cellHInput.value) || 3.9;
                const gap = parseFloat(cellGapInput.value) || 2;
                const wm = parseFloat(whiteMarginInput.value) || 2;
                const type = state.type;
                const margin_mm = 5;
                const cellW_mm = cw * 10, cellH_mm = ch * 10, gap_mm = gap, whiteMargin_mm = wm;
                const availW = A4_W_MM - 2 * margin_mm, availH = A4_H_MM - 2 * margin_mm;
                let cols = Math.max(1, Math.floor((availW + gap_mm) / (cellW_mm + gap_mm)));
                let rows = Math.max(1, Math.floor((availH + gap_mm) / (cellH_mm + gap_mm)));
                const totalW = cols * (cellW_mm + gap_mm) - gap_mm;
                const totalH = rows * (cellH_mm + gap_mm) - gap_mm;
                const offsetX = margin_mm + (availW - totalW) / 2;
                const offsetY = margin_mm + (availH - totalH) / 2;

                let imgOffsetX_mm = 0, imgOffsetY_mm = 0, imgW_mm = cellW_mm, imgH_mm = cellH_mm;
                if (type === 'polaroid') {
                    imgOffsetX_mm = whiteMargin_mm;
                    imgOffsetY_mm = whiteMargin_mm;
                    imgW_mm = Math.max(1, cellW_mm - 2 * whiteMargin_mm);
                    imgH_mm = Math.max(1, cellH_mm - whiteMargin_mm - 4 * whiteMargin_mm);
                }

                const cellW_px = mmToPx(cellW_mm, dpi), cellH_px = mmToPx(cellH_mm, dpi);
                const gap_px = mmToPx(gap_mm, dpi);
                const offsetX_px = mmToPx(offsetX, dpi), offsetY_px = mmToPx(offsetY, dpi);
                const imgOffsetX_px = mmToPx(imgOffsetX_mm, dpi), imgOffsetY_px = mmToPx(imgOffsetY_mm, dpi);
                const imgW_px = mmToPx(imgW_mm, dpi), imgH_px = mmToPx(imgH_mm, dpi);

                // 加载图片（使用高质量原图）
                const imgMap = {};
                const imgPromises = [];
                for (const id of slots) {
                    if (!id || imgMap[id]) continue;
                    const imgData = state.images.find(im => im.id === id);
                    if (imgData) {
                        imgPromises.push(loadImage(imgData.dataUrl).then(img => { imgMap[id] = { img, data: imgData }; }).catch(() => {}));
                    }
                }
                await Promise.all(imgPromises);

                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        const x = offsetX_px + c * (cellW_px + gap_px);
                        const y = offsetY_px + r * (cellH_px + gap_px);
                        const idx = r * cols + c;
                        const imgId = (idx < slots.length) ? slots[idx] : null;

                        if (type === 'polaroid') {
                            ctx.fillStyle = '#ffffff';
                            ctx.fillRect(x, y, cellW_px, cellH_px);
                            const ix = x + imgOffsetX_px, iy = y + imgOffsetY_px;
                            ctx.fillStyle = '#f1f5f9';
                            ctx.fillRect(ix, iy, imgW_px, imgH_px);
                            if (imgId && imgMap[imgId]) {
                                const { img, data } = imgMap[imgId];
                                const ox = data.ox || 0.5, oy = data.oy || 0.5;
                                const sc = data.scale || 1;
                                // cover base: 取宽高中较大比，再乘以 scale
                                const baseScale = Math.max(imgW_px / img.width, imgH_px / img.height);
                                const drawScale = baseScale * sc;
                                const dw = img.width * drawScale, dh = img.height * drawScale;
                                const dx = ix + (imgW_px - dw) * ox;
                                const dy = iy + (imgH_px - dh) * oy;
                                ctx.save();
                                ctx.beginPath();
                                ctx.rect(ix, iy, imgW_px, imgH_px);
                                ctx.clip();
                                ctx.drawImage(img, dx, dy, dw, dh);
                                ctx.restore();
                            }
                            ctx.strokeStyle = '#cccccc';
                            ctx.lineWidth = 0.5;
                            ctx.strokeRect(x, y, cellW_px, cellH_px);
                        } else {
                            ctx.fillStyle = '#ffffff';
                            ctx.fillRect(x, y, cellW_px, cellH_px);
                            if (imgId && imgMap[imgId]) {
                                const { img, data } = imgMap[imgId];
                                const ox = data.ox || 0.5, oy = data.oy || 0.5;
                                const sc = data.scale || 1;
                                // cover base 再乘 scale
                                const baseScale = Math.max(cellW_px / img.width, cellH_px / img.height);
                                const drawScale = baseScale * sc;
                                const dw = img.width * drawScale, dh = img.height * drawScale;
                                const dx = x + (cellW_px - dw) * ox;
                                const dy = y + (cellH_px - dh) * oy;
                                ctx.save();
                                ctx.beginPath();
                                ctx.rect(x, y, cellW_px, cellH_px);
                                ctx.clip();
                                ctx.drawImage(img, dx, dy, dw, dh);
                                ctx.restore();
                            }
                            ctx.strokeStyle = '#e2e8f0';
                            ctx.lineWidth = 0.3;
                            ctx.strokeRect(x, y, cellW_px, cellH_px);
                        }
                    }
                }
                return canvas;
            }

            // ---------- 高清导出 PDF ----------
            async function exportHighQualityPDF() {
                const btn = hdPdfBtn;
                btn.textContent = '⏳';
                btn.disabled = true;
                try {
                    const dpi = 600;
                    const pageCount = state.pages.length || 1;
                    const pdf = new jspdf.jsPDF('p', 'mm', 'a4');
                    for (let p = 0; p < pageCount; p++) {
                        const canvas = await renderPageToCanvas(p, dpi);
                        const imgData = canvas.toDataURL('image/jpeg', 0.98);
                        if (p > 0) pdf.addPage();
                        pdf.addImage(imgData, 'JPEG', 0, 0, 210, 297, undefined, 'FAST');
                    }
                    const filename = prompt('请输入文件名', '高清排版_' + new Date().toISOString().slice(0, 10));
                    pdf.save((filename || '高清排版') + '.pdf');
                } catch (err) {
                    console.error(err);
                    alert('高清PDF导出失败: ' + err.message);
                } finally {
                    btn.textContent = '📄 高清PDF';
                    btn.disabled = false;
                }
            }

            // ---------- 高清导出 PNG ----------
            async function exportHighQualityPNG() {
                const btn = hdPngBtn;
                btn.textContent = '⏳';
                btn.disabled = true;
                try {
                    const current = Math.min(state.currentPage, state.pages.length - 1);
                    const canvas = await renderPageToCanvas(current, 600);
                    const link = document.createElement('a');
                    link.download = '高清排版_第' + (current + 1) + '页_' + new Date().toISOString().slice(0, 10) + '.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                } catch (err) {
                    console.error(err);
                    alert('高清PNG导出失败: ' + err.message);
                } finally {
                    btn.textContent = '🖼 高清PNG';
                    btn.disabled = false;
                }
            }

            // ---------- 视图控制 ----------
            function setupViewControls() {
                function zoomAtPoint(factor, clientX, clientY) {
                    const wrapperRect = viewWrapper.getBoundingClientRect();
                    const pageW = state._pageW || mmToPx(A4_W_MM, BASE_DPI);
                    const pageH = state._pageH || mmToPx(A4_H_MM, BASE_DPI);
                    const baseX = (wrapperRect.width - pageW) / 2;
                    const baseY = (wrapperRect.height - pageH) / 2;
                    const mx = clientX - wrapperRect.left;
                    const my = clientY - wrapperRect.top;
                    const px = (mx - baseX - state.viewTranslateX) / state.viewScale;
                    const py = (my - baseY - state.viewTranslateY) / state.viewScale;
                    const newScale = clamp(state.viewScale * factor, 0.1, 5);
                    state.viewScale = newScale;
                    state.viewTranslateX = mx - baseX - px * newScale;
                    state.viewTranslateY = my - baseY - py * newScale;
                    updateViewTransform();
                }

                function zoomButton(factor) {
                    const r = viewWrapper.getBoundingClientRect();
                    zoomAtPoint(factor, r.left + r.width / 2, r.top + r.height / 2);
                }

                zoomInBtn.addEventListener('click', () => zoomButton(1.2));
                zoomOutBtn.addEventListener('click', () => zoomButton(1 / 1.2));
                resetViewBtn.addEventListener('click', () => {
                    state.viewScale = 1;
                    state.viewTranslateX = 0;
                    state.viewTranslateY = 0;
                    updateViewTransform();
                });

                canvasWrap.addEventListener('wheel', function(e) {
                    e.preventDefault();
                    if (e.ctrlKey) {
                        zoomAtPoint(e.deltaY > 0 ? 0.9 : 1.1, e.clientX, e.clientY);
                    } else {
                        state.viewTranslateY -= e.deltaY;
                        updateViewTransform();
                    }
                }, { passive: false });

                let isDragging = false, startX, startY, startTx, startTy;
                canvasWrap.addEventListener('mousedown', function(e) {
                    if (e.button !== 0) return;
                    isDragging = true;
                    startX = e.clientX; startY = e.clientY;
                    startTx = state.viewTranslateX; startTy = state.viewTranslateY;
                    canvasWrap.style.cursor = 'grabbing';
                    e.preventDefault();
                });
                window.addEventListener('mousemove', function(e) {
                    if (!isDragging) return;
                    state.viewTranslateX = startTx + e.clientX - startX;
                    state.viewTranslateY = startTy + e.clientY - startY;
                    updateViewTransform();
                });
                window.addEventListener('mouseup', function() {
                    if (isDragging) { isDragging = false; canvasWrap.style.cursor = 'grab'; }
                });

                let startTouches = [], startTouchTx = 0, startTouchTy = 0;
                let startTouchScale = 1, isTouchDragging = false, lastDist = 0;

                canvasWrap.addEventListener('touchstart', function(e) {
                    if (e.touches.length === 1) {
                        const t = e.touches[0];
                        startTouches = [{ x: t.clientX, y: t.clientY }];
                        startTouchTx = state.viewTranslateX;
                        startTouchTy = state.viewTranslateY;
                        isTouchDragging = true;
                    } else if (e.touches.length === 2) {
                        const t1 = e.touches[0], t2 = e.touches[1];
                        lastDist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
                        startTouchScale = state.viewScale;
                        startTouches = [{ x: t1.clientX, y: t1.clientY }, { x: t2.clientX, y: t2.clientY }];
                        isTouchDragging = false;
                    }
                }, { passive: true });

                canvasWrap.addEventListener('touchmove', function(e) {
                    e.preventDefault();
                    if (e.touches.length === 1 && isTouchDragging) {
                        const t = e.touches[0];
                        state.viewTranslateX = startTouchTx + t.clientX - startTouches[0].x;
                        state.viewTranslateY = startTouchTy + t.clientY - startTouches[0].y;
                        updateViewTransform();
                    } else if (e.touches.length === 2) {
                        const t1 = e.touches[0], t2 = e.touches[1];
                        const dist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
                        const newScale = clamp(startTouchScale * dist / lastDist, 0.1, 5);
                        const cx = (t1.clientX + t2.clientX) / 2;
                        const cy = (t1.clientY + t2.clientY) / 2;
                        const wrapperRect = viewWrapper.getBoundingClientRect();
                        const pageW = state._pageW || mmToPx(A4_W_MM, BASE_DPI);
                        const pageH = state._pageH || mmToPx(A4_H_MM, BASE_DPI);
                        const baseX = (wrapperRect.width - pageW) / 2;
                        const baseY = (wrapperRect.height - pageH) / 2;
                        const mx = cx - wrapperRect.left, my = cy - wrapperRect.top;
                        const px = (mx - baseX - state.viewTranslateX) / state.viewScale;
                        const py = (my - baseY - state.viewTranslateY) / state.viewScale;
                        state.viewScale = newScale;
                        state.viewTranslateX = mx - baseX - px * newScale;
                        state.viewTranslateY = my - baseY - py * newScale;
                        updateViewTransform();
                        lastDist = dist;
                    }
                }, { passive: false });

                canvasWrap.addEventListener('touchend', function(e) {
                    if (e.touches.length === 0) isTouchDragging = false;
                }, { passive: true });
            }

            // ---------- 事件绑定 ----------
            function initEvents() {
                [cellWInput, cellHInput, cellGapInput, whiteMarginInput].forEach(input => {
                    input.addEventListener('change', function() {
                        const val = parseFloat(this.value);
                        if (isNaN(val) || val < 0) this.value = this.defaultValue;
                        redistributeImages();
                        render();
                        saveSettings();
                    });
                    input.addEventListener('input', function() {
                        clearTimeout(this._timer);
                        this._timer = setTimeout(() => {
                            redistributeImages();
                            render();
                            saveSettings();
                        }, 300);
                    });
                });

                typeGroup.addEventListener('click', function(e) {
                    const btn = e.target.closest('.btn');
                    if (!btn || !btn.dataset.type) return;
                    typeGroup.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    state.type = btn.dataset.type;
                    redistributeImages();
                    render();
                    saveSettings();
                });

                fileInput.addEventListener('change', function() {
                    if (this.files.length > 0) {
                        addImages(this.files);
                        this.value = '';
                    }
                });

                hdPdfBtn.addEventListener('click', exportHighQualityPDF);
                hdPngBtn.addEventListener('click', exportHighQualityPNG);

                // 弹窗内删除按钮
                modalDeleteBtn.addEventListener('click', function() {
                    const id = editImageId;
                    closeEditor(false);
                    if (id) deleteImageById(id);
                });

                modalClose.addEventListener('click', () => closeEditor(false));
                modalCancel.addEventListener('click', () => closeEditor(false));
                modalSave.addEventListener('click', () => closeEditor(true));
                rotateBtn.addEventListener('click', rotateImage);

                editModal.addEventListener('click', function(e) {
                    if (e.target === this) closeEditor(false);
                });

                document.addEventListener('keydown', function(e) {
                    if (editModal.classList.contains('open')) {
                        if (e.key === 'Escape') closeEditor(false);
                        if (e.key === 'Enter') closeEditor(true);
                    }
                });

                let resizeTimer;
                window.addEventListener('resize', function() {
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(() => updateViewTransform(), 200);
                });

                document.addEventListener('dragover', e => e.preventDefault());
                document.addEventListener('drop', function(e) {
                    e.preventDefault();
                    if (e.dataTransfer.files.length > 0) addImages(e.dataTransfer.files);
                });

                setupEditGestures();
                setupViewControls();
            }

            // ---------- 初始化 ----------
            function init() {
                // 先应用缓存设置（在 DOM 元素已存在时调用）
                loadSettings();

                const layout = calcLayout();
                state.pages = [{ slots: new Array(layout.cols * layout.rows).fill(null) }];
                state.currentPage = 0;

                const wrapRect = canvasWrap.getBoundingClientRect();
                const pageW = mmToPx(A4_W_MM, BASE_DPI);
                const pageH = mmToPx(A4_H_MM, BASE_DPI);
                state.viewScale = Math.min((wrapRect.width - 16) / pageW, (wrapRect.height - 16) / pageH, 1);
                state.viewTranslateX = 0;
                state.viewTranslateY = 0;

                render();
                initEvents();
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>
</body>
</html>
